<script>
(function(){
  // ============ STORAGE ============
  const STORAGE_KEY = 'sprint-history-v1';
  function loadStore(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { history:[], currentStreak:0, bestStreak:0 };
      const d = JSON.parse(raw);
      return {
        history: Array.isArray(d.history) ? d.history : [],
        currentStreak: Number(d.currentStreak) || 0,
        bestStreak: Number(d.bestStreak) || 0,
      };
    } catch { return { history:[], currentStreak:0, bestStreak:0 }; }
  }
  function saveStore(s){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch {}
  }
  let store = loadStore();

  // ============ STATE ============
  let targetSeconds = 15 * 60;
  let lastTaskName = '';
  let timerHandle = null;
  let startedAt = 0;
  let endsAt = 0;
  let currentTask = '';
  let beepedAt = new Set();
  let pauseCount = 0;
  let parentFullscreen = false;        // tracked from parent shell messages
  let sprintTookFullscreen = false;    // true if THIS sprint forced fullscreen
  const RING_CIRC = 565.48; // 2 * π * 90
  const PAUSE_KEY = 'sprint-paused-v1';

  // ============ PARENT FULLSCREEN BRIDGE ============
  // Sprint runs in an iframe inside daily-planner. We:
  //   1. Ask the parent shell to enter fullscreen (adds body.fullscreen — hides
  //      tabs/header, broadcasts to all iframes).
  //   2. ALSO try native fullscreen on our own iframe document — works on
  //      browsers that honor allowfullscreen, hides browser chrome too.
  // Both are best-effort; doesn't matter if either fails so long as one lands.
  function requestParentFullscreen(){
    try { if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type:'warroom:enter-fullscreen' }, '*');
    } } catch {}
    // Native fullscreen must be called from the user-gesture event handler.
    try {
      const el = document.documentElement;
      const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if (fn) fn.call(el);
    } catch {}
  }
  function releaseParentFullscreen(){
    try { if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type:'warroom:exit-fullscreen' }, '*');
    } } catch {}
    try {
      const fn = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
      if (fn && (document.fullscreenElement || document.webkitFullscreenElement)) fn.call(document);
    } catch {}
  }
  window.addEventListener('message', (ev) => {
    const d = ev && ev.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'warroom:fullscreen') parentFullscreen = !!d.on;
  });
  // Ask the shell where it stands so we don't kick the user out of an existing
  // manually-entered fullscreen when our sprint ends.
  try { if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type:'warroom:request-fullscreen-state' }, '*');
  } } catch {}

  // ============ ELEMENTS ============
  const $ = id => document.getElementById(id);
  const taskInput = $('taskInput');
  const targetChips = $('targetChips');
  const targetCustom = $('targetCustom');
  const startBtn = $('startBtn');
  const landingView = $('landingView');
  const gameView = $('gameView');
  const historyView = $('historyView');
  const stage = $('stage');
  const navPlay = $('navPlay');
  const navHistory = $('navHistory');
  const timerTime = $('timerTime');
  const timerSub = $('timerSub');
  const timerRing = $('timerRing');
  const ringFg = timerRing.querySelector('.fg');
  const runnerFill = $('runnerFill');
  const runner = $('runner');
  const gameTask = $('gameTask');
  const doneBtn = $('doneBtn');
  const quitBtn = $('quitBtn');
  const resultOverlay = $('resultOverlay');
  const resultEmoji = $('resultEmoji');
  const resultHeadline = $('resultHeadline');
  const resultSub = $('resultSub');
  const resultStats = $('resultStats');
  const resultStreak = $('resultStreak');
  const againBtn = $('againBtn');
  const homeBtn = $('homeBtn');
  const suggestions = $('suggestions');
  const pauseBtn = $('pauseBtn');
  const resumeBanner = $('resumeBanner');
  const resumeTaskEl = $('resumeTask');
  const resumeMetaEl = $('resumeMeta');
  const resumeBtn = $('resumeBtn');
  const discardPauseBtn = $('discardPauseBtn');
  const selectedTaskPill = $('selectedTaskPill');
  const selectedBadge = $('selectedBadge');
  const selectedText = $('selectedText');
  const clearSelectedBtn = $('clearSelectedBtn');

  // When a suggestion is clicked, we lock the choice in selectedTask so the user
  // can't accidentally edit the title and break the link to the source. Clearing
  // it (✕ on the pill, or Start) returns to free-text mode.
  let selectedTask = null; // { text, source, jobId, jobLabel, date }

  // ============ AUDIO (Web Audio synthesized) ============
  let audioCtx;
  function ac(){ if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} return audioCtx; }
  function beep(freq, dur, vol){
    const c = ac(); if (!c) return;
    try {
      if (c.state === 'suspended') c.resume();
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, c.currentTime);
      gain.gain.linearRampToValueAtTime(vol || .12, c.currentTime + .01);
      gain.gain.exponentialRampToValueAtTime(.001, c.currentTime + (dur || .15));
      osc.connect(gain); gain.connect(c.destination);
      osc.start(); osc.stop(c.currentTime + (dur || .15) + .02);
    } catch {}
  }
  function playStartFanfare(){ beep(660, .12); setTimeout(()=>beep(880, .12), 130); setTimeout(()=>beep(1320, .25, .15), 260); }
  function playTickBeep(){ beep(880, .08, .1); }
  function playLastSecond(){ beep(1320, .12, .14); }
  function playWinFanfare(){
    beep(523, .12); setTimeout(()=>beep(659, .12), 120); setTimeout(()=>beep(784, .12), 240);
    setTimeout(()=>beep(1047, .35, .18), 360);
  }
  function playLoseSound(){ beep(196, .25, .1); setTimeout(()=>beep(155, .35, .1), 220); }

  // ============ STATS ============
  function fmtMMSS(secs){
    const s = Math.max(0, Math.round(secs));
    const m = Math.floor(s / 60), r = s % 60;
    return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
  }
  function fmtFriendly(secs){
    const s = Math.max(0, Math.round(secs));
    if (s < 60) return `${s}s`;
    const m = Math.floor(s / 60), r = s % 60;
    return r === 0 ? `${m}m` : `${m}m ${r}s`;
  }
  function renderStats(){
    const total = store.history.length;
    const wins = store.history.filter(h => h.won).length;
    const winRate = total > 0 ? Math.round((wins / total) * 100) : 0;
    const todayKey = new Date().toLocaleDateString('en-CA', { timeZone:'America/Chicago' });
    const todayWins = store.history.filter(h => h.won && (h.completedAt || '').slice(0,10) === todayKey).length;
    const timeSaved = store.history.filter(h => h.won).reduce((sum, h) => sum + Math.max(0, h.targetSeconds - h.actualSeconds), 0);
    $('statsStrip').innerHTML = `
      <div class="stat-chip streak"><div class="v">${store.currentStreak}🔥</div><div class="l">Streak</div></div>
      <div class="stat-chip"><div class="v">${todayWins}</div><div class="l">Wins Today</div></div>
      <div class="stat-chip winrate"><div class="v">${winRate}%</div><div class="l">Win Rate</div></div>
      <div class="stat-chip"><div class="v">${fmtFriendly(timeSaved)}</div><div class="l">Time Saved</div></div>
      <div class="stat-chip"><div class="v">${total}</div><div class="l">Total Sprints</div></div>
    `;
  }

  // ============ TASK SUGGESTIONS ============
  // Each suggestion carries a `source` so we can filter by category.
  // source ∈ { 'priority', 'personal', 'goal', 'board', 'plan', 'recent' }
  let allSuggestions = [];
  let activeFilter = (function(){
    try { return localStorage.getItem('sprint-filter') || 'all'; } catch { return 'all'; }
  })();

  // Top row: category filters
  const FILTERS = [
    { id:'all',       label:'All' },
    { id:'due_week',  label:'Due This Week' },
    { id:'due_next',  label:'Due Next Week' },
    { id:'due_2wks',  label:'Due in 2 Weeks' },
    { id:'priority',  label:'★ Priority' },
    { id:'recent',    label:'Recent' },
  ];

  // Domain → job ID normalization. Plan rows use domains like "work" / "vt" / "ezrk" / "personal".
  // Personal todos use the same scheme. Goal pillars use board IDs directly (which are also lowercase).
  const JOB_ALIASES = {
    'work':'ecm', 'govtech':'ecm',
    'vitaltouch':'vt',
    'ezrklabs':'ezrk',
    'butterfly':'bha',
  };
  function normalizeJobId(j){
    if (!j) return '';
    const k = String(j).toLowerCase().trim();
    return JOB_ALIASES[k] || k;
  }
  let activeJob = (function(){
    try { return localStorage.getItem('sprint-job') || 'all'; } catch { return 'all'; }
  })();

  // ============ DATE HELPERS (Chicago time) ============
  // Returns YYYY-MM-DD for "today" in Chicago.
  function todayKeyChi(){
    return new Date().toLocaleDateString('en-CA', { timeZone:'America/Chicago' });
  }
  // Parse YYYY-MM-DD into a Date pinned to local-midnight (compare-safe vs other YYYY-MM-DD strings).
  // Returns range [thisWeekStart, thisWeekEnd, nextWeekStart, nextWeekEnd] as YYYY-MM-DD strings.
  // Week = Monday → Sunday (matches ISO and the rest of War Room).
  function weekRanges(){
    const todayKey = todayKeyChi();
    // Build Chi-local Date by parsing YYYY-MM-DD
    const [y, m, d] = todayKey.split('-').map(Number);
    const today = new Date(y, m - 1, d);
    const dow = today.getDay(); // 0=Sun..6=Sat
    // Monday-based offset: Sun=-6, Mon=0, Tue=-1, etc.
    const mondayOffset = dow === 0 ? -6 : 1 - dow;
    const thisMon = new Date(today); thisMon.setDate(today.getDate() + mondayOffset);
    const thisSun = new Date(thisMon); thisSun.setDate(thisMon.getDate() + 6);
    const nextMon = new Date(thisMon); nextMon.setDate(thisMon.getDate() + 7);
    const nextSun = new Date(thisMon); nextSun.setDate(thisMon.getDate() + 13);
    const twoMon  = new Date(thisMon); twoMon.setDate(thisMon.getDate() + 14);
    const twoSun  = new Date(thisMon); twoSun.setDate(thisMon.getDate() + 20);
    const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    return {
      thisWeekStart: fmt(thisMon), thisWeekEnd: fmt(thisSun),
      nextWeekStart: fmt(nextMon), nextWeekEnd: fmt(nextSun),
      twoWeekStart:  fmt(twoMon),  twoWeekEnd:  fmt(twoSun),
      todayKey,
    };
  }
  function dueThisWeek(dateKey, ranges){
    if (!dateKey) return false;
    return dateKey >= ranges.thisWeekStart && dateKey <= ranges.thisWeekEnd;
  }
  function dueNextWeek(dateKey, ranges){
    if (!dateKey) return false;
    return dateKey >= ranges.nextWeekStart && dateKey <= ranges.nextWeekEnd;
  }
  function dueTwoWeeks(dateKey, ranges){
    if (!dateKey) return false;
    return dateKey >= ranges.twoWeekStart && dateKey <= ranges.twoWeekEnd;
  }

  // Boards (jobs) loaded from goal-board-v2 — `{id, name, color}` per board.
  // Used both for job-chip labels and for resolving a goal's pillar → job name.
  function loadBoards(){
    try {
      const raw = localStorage.getItem('goal-board-v2');
      if (!raw) return [];
      const data = JSON.parse(raw) || {};
      return Array.isArray(data.boards) ? data.boards : [];
    } catch { return []; }
  }
  let allBoards = loadBoards();
  function jobLabel(jobId){
    if (!jobId) return '';
    const b = allBoards.find(x => normalizeJobId(x.id) === jobId);
    if (b) return (b.name || jobId).toUpperCase();
    return jobId.toUpperCase();
  }

  function loadSuggestions(){
    allBoards = loadBoards();
    const seen = new Set();
    const out = [];
    // ids: extra source identifiers we need to mark done in the source.
    //   personal: { todoId }
    //   goal:     { goalId, taskId }
    //   board:    { boardId, goalId, taskId }
    //   plan:     { planId }
    const push = (text, source, dateKey, jobId, ids, details) => {
      const t = (text || '').trim();
      if (!t) return;
      const k = t.toLowerCase();
      if (seen.has(k)) return;
      seen.add(k);
      const j = normalizeJobId(jobId || '');
      out.push({
        text: t,
        source,
        date: dateKey || '',
        jobId: j,
        jobLabel: jobLabel(j),
        ids: ids || {},
        details: (details || '').trim(),
      });
    };

    // 1. Personal todos cache (priority first, then regular). Default the job
    // to 'personal' if unset — otherwise these items would never count toward
    // a "Personal" job chip even though they live on the Personal page.
    try {
      const raw = localStorage.getItem('personal-todos-cache');
      if (raw) {
        const cache = JSON.parse(raw) || {};
        const items = Array.isArray(cache.items) ? cache.items : [];
        items.filter(i => i.priority).forEach(i => push(i.text, 'priority', i.date, i.job || 'personal', { todoId: i.id }, i.details));
        items.filter(i => !i.priority).forEach(i => push(i.text, 'personal', i.date, i.job || 'personal', { todoId: i.id }, i.details));
      }
    } catch {}

    // 2. Quarterly goals open action items (current quarter)
    try {
      const raw = localStorage.getItem('quarterly-goals-v1');
      if (raw) {
        const data = JSON.parse(raw) || {};
        const goals = Array.isArray(data.goals) ? data.goals : [];
        const now = new Date();
        const curQ = now.getFullYear() + '-Q' + (Math.floor(now.getMonth() / 3) + 1);
        goals
          .filter(g => (g.quarter || curQ) === curQ && g.status !== 'dn')
          .forEach(g => {
            (g.actionItems || []).forEach(ai => {
              if (!ai || ai.done) return;
              const d = ai.dueDate || ai.startDate || g.targetDate || '';
              push(ai.text, 'goal', d, g.pillar, { goalId: g.id, taskId: ai.id }, ai.details);
            });
          });
      }
    } catch {}

    // 3. Board card open action items (open goals only). Board id == job id.
    allBoards.forEach(b => {
      (b.goals || []).forEach(g => {
        if (g.status === 'dn') return;
        (g.actionItems || []).forEach(ai => {
          if (!ai || ai.done) return;
          const d = ai.dueDate || ai.startDate || g.targetDate || '';
          push(ai.text, 'board', d, b.id, { boardId: b.id, goalId: g.id, taskId: ai.id }, ai.details);
        });
      });
    });

    // 4. Today's plan (always today by definition). domain == job id.
    try {
      const raw = localStorage.getItem('daily-plan');
      if (raw) {
        const plan = JSON.parse(raw) || {};
        const today = todayKeyChi();
        const items = Array.isArray(plan[today]) ? plan[today] : [];
        items.forEach(it => {
          if (it.done) return;
          push(it.text, 'plan', today, it.domain, { planId: it.id });
        });
      }
    } catch {}

    // 5. Recent winning sprints (no due-date or job semantics)
    store.history.slice(-15).reverse().forEach(h => push(h.taskName, 'recent', '', '', {}));

    return out;
  }

  function setFilter(id){
    activeFilter = id;
    try { localStorage.setItem('sprint-filter', id); } catch {}
    renderFilterChips();
    renderSuggestions();
  }
  function setJob(id){
    activeJob = id;
    try { localStorage.setItem('sprint-job', id); } catch {}
    renderFilterChips();
    renderSuggestions();
  }

  // Apply category filter (FILTERS) only.
  function passesCategory(s, ranges){
    if (activeFilter === 'all')      return true;
    if (activeFilter === 'priority') return s.source === 'priority';
    if (activeFilter === 'recent')   return s.source === 'recent';
    if (activeFilter === 'due_week') return dueThisWeek(s.date, ranges);
    if (activeFilter === 'due_next') return dueNextWeek(s.date, ranges);
    if (activeFilter === 'due_2wks') return dueTwoWeeks(s.date, ranges);
    return true;
  }
  // Group label → set of jobIds. Built each render. Used so chips dedupe by
  // display name (e.g. legacy 'personal' + the 'b-personal' board both labeled
  // "Personal" collapse into one chip + one filter).
  let jobLabelGroups = new Map();
  function groupKeyForJob(jobId){
    if (!jobId) return '';
    const lbl = (jobLabel(jobId) || jobId).toUpperCase();
    return lbl;
  }
  function passesJob(s){
    if (activeJob === 'all') return true;
    if (activeJob === 'none') return !s.jobId;
    // Match by label-group, not strict ID — so an item tagged 'personal' AND
    // an item tagged 'b-personal' both pass the "Personal" chip.
    return groupKeyForJob(s.jobId) === groupKeyForJob(activeJob);
  }

  function renderFilterChips(){
    const wrap = $('filterChips');
    if (!wrap) return;
    const ranges = weekRanges();

    // Category counts respect the *job* filter so the numbers match what user sees.
    const catCounts = { all: 0, due_week: 0, due_next: 0, due_2wks: 0, priority: 0, recent: 0 };
    allSuggestions.forEach(s => {
      if (!passesJob(s)) return;
      catCounts.all += 1;
      if (dueThisWeek(s.date, ranges)) catCounts.due_week += 1;
      if (dueNextWeek(s.date, ranges)) catCounts.due_next += 1;
      if (dueTwoWeeks(s.date, ranges)) catCounts.due_2wks += 1;
      if (s.source === 'priority') catCounts.priority += 1;
      if (s.source === 'recent')   catCounts.recent += 1;
    });
    // Job counts respect the *category* filter for the same reason.
    const jobCounts = { all: 0, none: 0 };
    allSuggestions.forEach(s => {
      if (!passesCategory(s, ranges)) return;
      jobCounts.all += 1;
      const k = s.jobId || 'none';
      jobCounts[k] = (jobCounts[k] || 0) + 1;
    });

    // Top row — categories
    const catRow = FILTERS
      .filter(f => f.id === 'all' || catCounts[f.id] > 0)
      .map(f => `
        <button class="filter-chip ${f.id===activeFilter?'active':''}" data-kind="cat" data-filter="${f.id}">
          <span>${f.label}</span><span class="count">${catCounts[f.id]||0}</span>
        </button>
      `).join('');

    // Job row — built from boards in the data, then deduped by display label
    // so e.g. legacy 'personal' + 'b-personal' both labeled "Personal"
    // collapse into a single chip.
    const jobIdsInData = new Set();
    allSuggestions.forEach(s => { if (s.jobId) jobIdsInData.add(s.jobId); });
    // Build a label-keyed map: label → { ids:Set, count, primaryId }
    const labelMap = new Map();
    const orderedLabels = [];
    const recordIntoLabelMap = (id) => {
      const lbl = (jobLabel(id) || id).toUpperCase();
      if (!labelMap.has(lbl)) {
        labelMap.set(lbl, { ids: new Set(), primaryId: id });
        orderedLabels.push(lbl);
      }
      labelMap.get(lbl).ids.add(id);
    };
    // Boards first (preserve user's board order so chip order is intentional)
    allBoards.forEach(b => {
      const id = normalizeJobId(b.id);
      if (jobIdsInData.has(id)) recordIntoLabelMap(id);
    });
    // Then any leftover job IDs (legacy ones not yet bound to a board)
    jobIdsInData.forEach(id => recordIntoLabelMap(id));
    // Recompute jobCounts grouped by label so dedupe shows the right number.
    const jobCountsByLabel = {};
    allSuggestions.forEach(s => {
      if (!passesCategory(s, ranges)) return;
      const lbl = s.jobId ? (jobLabel(s.jobId) || s.jobId).toUpperCase() : '';
      if (!lbl) return;
      jobCountsByLabel[lbl] = (jobCountsByLabel[lbl] || 0) + 1;
    });
    // Active label = label of activeJob (so click-to-toggle still feels right)
    const activeLabel = activeJob === 'all' ? 'all' :
                       activeJob === 'none' ? 'none' :
                       (jobLabel(activeJob) || activeJob).toUpperCase();
    let jobRow = '';
    if (orderedLabels.length >= 1) {
      jobRow = `
        <button class="filter-chip ${activeJob==='all'?'active':''}" data-kind="job" data-filter="all">
          <span>All Jobs</span><span class="count">${jobCounts.all||0}</span>
        </button>
        ${orderedLabels.map(lbl => {
          const grp = labelMap.get(lbl);
          return `
            <button class="filter-chip ${activeLabel===lbl?'active':''}" data-kind="job" data-filter="${escapeAttr(grp.primaryId)}">
              <span>${escapeHtml(lbl)}</span><span class="count">${jobCountsByLabel[lbl]||0}</span>
            </button>
          `;
        }).join('')}
      `;
    }
    // Cache for passesJob (next render will rebuild)
    jobLabelGroups = labelMap;

    wrap.innerHTML = `
      <div class="filter-row-inner">${catRow}</div>
      ${jobRow ? `<div class="filter-row-inner filter-row-jobs">${jobRow}</div>` : ''}
    `;
    wrap.querySelectorAll('.filter-chip').forEach(el => {
      el.addEventListener('click', () => {
        if (el.dataset.kind === 'cat') setFilter(el.dataset.filter);
        else setJob(el.dataset.filter);
      });
    });
  }

  function badgeFor(it){
    if (it.source === 'priority') return '★ ' + (it.jobLabel || 'PERSONAL');
    if (it.jobLabel)              return it.jobLabel;
    if (it.source === 'recent')   return 'RECENT';
    return (it.source || '').toUpperCase();
  }

  function setSelectedTask(it){
    selectedTask = it ? {
      text: it.text,
      source: it.source,
      jobId: it.jobId || '',
      jobLabel: it.jobLabel || '',
      date: it.date || '',
      ids: it.ids || {},
      details: it.details || '',
    } : null;
    renderSelectedPill();
    // When something is selected, hide the free-text input. When nothing is
    // selected, show the input and keep whatever the user had typed.
    taskInput.style.display = selectedTask ? 'none' : '';
    if (selectedTask) {
      taskInput.value = selectedTask.text;
    } else {
      // Returning to free-text mode — leave input empty so the user starts fresh.
      taskInput.value = '';
      taskInput.focus();
    }
    // Re-render so the selected suggestion gets a highlight
    renderSuggestionsList();
  }

  function renderSelectedPill(){
    if (!selectedTask) { selectedTaskPill.style.display = 'none'; return; }
    selectedTaskPill.style.display = '';
    selectedBadge.textContent = badgeFor(selectedTask);
    selectedText.textContent = selectedTask.text;
    // Details panel: show a "Details" toggle on the pill if the source task
    // has notes attached. Click to expand a panel under the pill.
    let detailsEl = document.getElementById('selectedDetails');
    if (selectedTask.details) {
      if (!detailsEl) {
        detailsEl = document.createElement('div');
        detailsEl.id = 'selectedDetails';
        detailsEl.className = 'selected-task-details';
        selectedTaskPill.parentNode.insertBefore(detailsEl, selectedTaskPill.nextSibling);
      }
      detailsEl.innerHTML = `
        <button class="details-toggle" type="button">
          <span class="chev">▸</span><span class="lbl">Details</span>
        </button>
        <div class="details-body">${escapeHtml(selectedTask.details)}</div>
      `;
      const toggle = detailsEl.querySelector('.details-toggle');
      const body = detailsEl.querySelector('.details-body');
      const chev = detailsEl.querySelector('.chev');
      toggle.addEventListener('click', () => {
        const open = body.classList.toggle('open');
        chev.textContent = open ? '▾' : '▸';
      });
    } else if (detailsEl) {
      detailsEl.remove();
    }
  }

  // Split out so setSelectedTask can refresh the list highlight without
  // recomputing the suggestion list itself (which would re-fetch from storage).
  function renderSuggestionsList(){
    const ranges = weekRanges();
    const items = allSuggestions.filter(s => passesCategory(s, ranges) && passesJob(s));

    if (items.length === 0 && allSuggestions.length > 0) {
      suggestions.style.display = '';
      suggestions.innerHTML = `<div class="suggestions-empty">No matches. Pick a different filter or type a task above.</div>`;
      return;
    }
    if (items.length === 0) { suggestions.style.display = 'none'; return; }
    suggestions.style.display = '';
    const selKey = selectedTask ? selectedTask.text.toLowerCase() : '';
    // Stash the live items by index so click handlers can read the full object
    // (including ids) without round-tripping through data attributes.
    suggestions._items = items;
    suggestions.innerHTML = items.slice(0, 60).map((it, idx) => {
      const isSel = selKey && it.text.toLowerCase() === selKey;
      const dot = it.details ? `<span class="details-dot" title="Has details"></span>` : '';
      return `
        <div class="suggestion${isSel ? ' is-selected' : ''}" data-idx="${idx}">
          ${dot}<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(it.text)}</span>
          <span class="job">${escapeHtml(badgeFor(it))}</span>
          <span class="arr">→</span>
        </div>
      `;
    }).join('');
    suggestions.querySelectorAll('.suggestion').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.idx, 10);
        const it = suggestions._items[idx];
        if (!it) return;
        // Toggle: clicking the already-selected item clears it
        if (selectedTask && selectedTask.text.toLowerCase() === it.text.toLowerCase()) {
          setSelectedTask(null);
          return;
        }
        setSelectedTask(it);
      });
    });
  }

  function renderSuggestions(){
    allSuggestions = loadSuggestions();
    renderFilterChips();
    renderSuggestionsList();
  }

  if (clearSelectedBtn) clearSelectedBtn.addEventListener('click', () => setSelectedTask(null));
  function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function escapeAttr(s){ return escapeHtml(s).replace(/"/g, '&quot;'); }

  // ============ TARGET PICKER ============
  targetChips.querySelectorAll('.target-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      targetChips.querySelectorAll('.target-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      targetSeconds = parseInt(chip.dataset.min, 10) * 60;
      targetCustom.value = '';
    });
  });
  targetCustom.addEventListener('input', () => {
    const v = parseInt(targetCustom.value, 10);
    if (!Number.isFinite(v) || v <= 0) return;
    targetChips.querySelectorAll('.target-chip').forEach(c => c.classList.remove('active'));
    targetSeconds = v * 60;
  });

  // ============ NAV ============
  function showView(v){
    if (v === 'play') {
      landingView.style.display = '';
      gameView.style.display = 'none';
      historyView.style.display = 'none';
      navPlay.classList.add('active'); navHistory.classList.remove('active');
      // Landing manages its own internal scroll (.landing-body). Stage stays put.
      stage.style.overflowY = 'hidden';
      renderResumeBanner();
      renderSuggestions();
    } else if (v === 'history') {
      landingView.style.display = 'none';
      gameView.style.display = 'none';
      historyView.style.display = '';
      navPlay.classList.remove('active'); navHistory.classList.add('active');
      stage.style.overflowY = 'auto';
      renderHistory();
    } else if (v === 'game') {
      landingView.style.display = 'none';
      // Default CSS for .game is display:none; force flex inline so the
      // active sprint actually renders.
      gameView.style.display = 'flex';
      historyView.style.display = 'none';
      stage.style.overflowY = 'hidden';
    }
  }
  navPlay.onclick = () => showView('play');
  navHistory.onclick = () => showView('history');

  // ============ PAUSE / RESUME ============
  function loadPaused(){
    try {
      const raw = localStorage.getItem(PAUSE_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (!d || !d.taskName || !Number.isFinite(d.targetSeconds)) return null;
      return d;
    } catch { return null; }
  }
  function savePaused(d){
    try { localStorage.setItem(PAUSE_KEY, JSON.stringify(d)); } catch {}
  }
  function clearPaused(){
    try { localStorage.removeItem(PAUSE_KEY); } catch {}
  }

  function pauseSprint(){
    if (!timerHandle) return;
    const now = Date.now();
    const elapsedSeconds = Math.max(0, Math.round((now - startedAt) / 1000));
    const remainingSeconds = Math.max(0, targetSeconds - elapsedSeconds);
    if (remainingSeconds <= 0) { finishSprint(false); return; }
    clearInterval(timerHandle); timerHandle = null;
    document.title = 'Sprint — War Room';
    pauseCount += 1;
    savePaused({
      taskName: currentTask,
      targetSeconds,
      elapsedSeconds,
      pauseCount,
      pausedAt: now,
    });
    renderResumeBanner();
    // Drop fullscreen on pause so user can reach other War Room tabs.
    // Re-enter on resume below.
    if (sprintTookFullscreen) {
      sprintTookFullscreen = false;
      releaseParentFullscreen();
    }
    showView('play');
  }

  function resumeSprint(){
    const p = loadPaused();
    if (!p) { renderResumeBanner(); return; }
    currentTask = p.taskName;
    lastTaskName = p.taskName;
    targetSeconds = p.targetSeconds;
    pauseCount = Number(p.pauseCount) || 0;
    const elapsedMs = (Number(p.elapsedSeconds) || 0) * 1000;
    const now = Date.now();
    startedAt = now - elapsedMs;
    endsAt = startedAt + targetSeconds * 1000;
    beepedAt = new Set();
    gameTask.textContent = currentTask;
    timerSub.textContent = `target — ${fmtMMSS(targetSeconds)}${pauseCount?`  ·  resumed`:''}`;
    timerRing.classList.remove('warn','danger');
    timerTime.classList.remove('danger');
    runner.classList.remove('warn');
    // Re-enter fullscreen on resume (unless user was already there)
    if (!parentFullscreen) {
      sprintTookFullscreen = true;
      requestParentFullscreen();
    } else {
      sprintTookFullscreen = false;
    }
    showView('game');
    tickGame();
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(tickGame, 200);
  }

  function discardPaused(){
    if (!confirm("Discard the paused sprint? It won't be recorded.")) return;
    clearPaused();
    pauseCount = 0;
    renderResumeBanner();
  }

  function renderResumeBanner(){
    const p = loadPaused();
    if (!p) { resumeBanner.style.display = 'none'; return; }
    resumeBanner.style.display = '';
    const remaining = Math.max(0, p.targetSeconds - (Number(p.elapsedSeconds) || 0));
    resumeTaskEl.textContent = p.taskName;
    const pauseStr = p.pauseCount > 1 ? `  ·  ${p.pauseCount} pauses` : '';
    resumeMetaEl.textContent = `${fmtMMSS(remaining)} left of ${fmtFriendly(p.targetSeconds)} target${pauseStr}`;
  }

  if (pauseBtn) pauseBtn.addEventListener('click', pauseSprint);
  if (resumeBtn) resumeBtn.addEventListener('click', resumeSprint);
  if (discardPauseBtn) discardPauseBtn.addEventListener('click', discardPaused);

  // ============ MANUAL TASKS → PERSONAL TODOS ============
  // When user types a fresh task that isn't already in their suggestion sources,
  // queue it for personal-todos.html to pick up and create as a Firestore todo.
  // This keeps Sprint and Personal in sync — anything you race here gets tracked there.
  function maybeQueueAsPersonalTodo(text){
    const t = (text || '').trim();
    if (!t) return;
    // If text already matches an existing suggestion (any source), don't re-create —
    // just update the existing todo via personal-todos itself if needed.
    const k = t.toLowerCase();
    const hasMatch = (allSuggestions || []).some(s => s.text.toLowerCase() === k);
    if (hasMatch) return;
    try {
      const QKEY = 'sprint-pending-personal-todos';
      const raw = localStorage.getItem(QKEY);
      const queue = raw ? (JSON.parse(raw) || []) : [];
      queue.push({
        text: t,
        createdAt: Date.now(),
        date: todayKeyChi(),
        fromSprint: true,
      });
      localStorage.setItem(QKEY, JSON.stringify(queue.slice(-50)));
    } catch {}
  }

  // ============ START ============
  startBtn.addEventListener('click', () => {
    // Picked-from-list takes precedence over whatever's in the input.
    const text = (selectedTask ? selectedTask.text : (taskInput.value || '')).trim();
    if (!text) { taskInput.focus(); return; }
    if (targetSeconds <= 0) return;
    // Only manual / free-text tasks get queued to Personal. Selected tasks
    // are already tracked in their source (Personal, Goals, Board, etc.).
    if (!selectedTask) maybeQueueAsPersonalTodo(text);
    // If user starts a fresh sprint while one is paused, drop the pause silently —
    // they explicitly chose to start something new.
    clearPaused();
    pauseCount = 0;
    renderResumeBanner();
    // Sprint = focus mode. Force shell fullscreen unless user was already there.
    if (!parentFullscreen) {
      sprintTookFullscreen = true;
      requestParentFullscreen();
    } else {
      sprintTookFullscreen = false;
    }
    currentTask = text;
    lastTaskName = text;
    startedAt = Date.now();
    endsAt = startedAt + targetSeconds * 1000;
    beepedAt = new Set();
    gameTask.textContent = text;
    timerSub.textContent = `target — ${fmtMMSS(targetSeconds)}`;
    showView('game');
    timerRing.classList.remove('warn','danger');
    timerTime.classList.remove('danger');
    runner.classList.remove('warn');
    playStartFanfare();
    tickGame();
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(tickGame, 200);
  });

  // ============ TICK ============
  // Past target time, the timer keeps running and counts UP — user can keep
  // working and hit Done whenever they actually finish. Recorded actualSeconds
  // will exceed targetSeconds, which marks it as a loss (or they can override).
  function tickGame(){
    const now = Date.now();
    const elapsedMs = now - startedAt;
    const remainingMs = endsAt - now;
    const remaining = Math.max(0, remainingMs / 1000);
    const overtimeSecs = remainingMs < 0 ? Math.floor(-remainingMs / 1000) : 0;
    const isOvertime = overtimeSecs > 0;

    // Display: countdown until target hit, then count-up "+OVER" once over.
    if (isOvertime) {
      timerTime.textContent = `+${fmtMMSS(overtimeSecs)}`;
      document.title = `⏱ +${fmtMMSS(overtimeSecs)} OVER — Sprint`;
    } else {
      timerTime.textContent = fmtMMSS(remaining);
      document.title = `⏱ ${fmtMMSS(remaining)} — Sprint`;
    }

    // Ring fills as time elapses, capped at 100% (no wrap-around on overtime).
    const pct = Math.min(1, elapsedMs / (targetSeconds * 1000));
    ringFg.setAttribute('stroke-dashoffset', String(-RING_CIRC * pct));
    runnerFill.style.width = `${pct * 100}%`;
    runner.style.left = `${pct * 100}%`;

    // Color phases. Once overtime, lock to danger red and stop the pulse.
    timerRing.classList.toggle('warn', !isOvertime && remaining <= 30 && remaining > 10);
    timerRing.classList.toggle('danger', isOvertime || remaining <= 10);
    timerTime.classList.toggle('danger', isOvertime || remaining <= 10);
    runner.classList.toggle('warn', !isOvertime && remaining <= 30);
    timerTime.classList.toggle('pulse', !isOvertime && remaining > 10);

    // Beeps: last-5-second ticks before target, one final long tone at the
    // moment we cross into overtime, then silence so the user isn't tortured.
    if (!isOvertime) {
      const wholeSecondsLeft = Math.ceil(remaining);
      if (wholeSecondsLeft <= 5 && wholeSecondsLeft > 0 && !beepedAt.has(wholeSecondsLeft)) {
        beepedAt.add(wholeSecondsLeft);
        if (wholeSecondsLeft === 1) playLastSecond(); else playTickBeep();
      }
    } else if (!beepedAt.has('overtime')) {
      // Cross-over moment — single low buzz, then quiet.
      beepedAt.add('overtime');
      try { beep(196, .35, .12); } catch {}
    }

    // Update the eyebrow tag once we cross into overtime so it reads
    // "OVERTIME" instead of "Sprint in progress".
    const eb = $('gameEyebrowText');
    if (eb) eb.textContent = isOvertime ? `Overtime — keep going` : 'Sprint in progress';
    // We deliberately do NOT auto-finish at remainingMs <= 0 anymore. The user
    // hits Done when they actually finish, however far over they went.
  }

  // ============ SOURCE COMPLETION ============
  // When a sprint linked to a real task is completed, mark the source done so
  // the task disappears from Personal / Goals / Board / Plan and from the
  // suggestion list on the next refresh.
  function completeSourceTask(sel){
    if (!sel || !sel.source) return;
    try {
      if (sel.source === 'personal' || sel.source === 'priority') {
        completePersonalTodo(sel);
      } else if (sel.source === 'goal') {
        completeGoalActionItem(sel);
      } else if (sel.source === 'board') {
        completeBoardActionItem(sel);
      } else if (sel.source === 'plan') {
        completePlanItem(sel);
      }
      // 'recent' and free-text don't have a source to complete.
    } catch (e) { console.warn('completeSourceTask failed', e); }
  }

  // Personal todos live in Firestore — sprint can't write directly. Queue the
  // completion in localStorage; personal-todos.html drains the queue (on load
  // and via a `storage` event listener it added). Locally drop the item from
  // the cache so it disappears from suggestions immediately.
  function completePersonalTodo(sel, addSeconds){
    const id = sel.ids && sel.ids.todoId;
    if (!id) return;
    const QKEY = 'sprint-pending-completions';
    let queue = [];
    try { queue = JSON.parse(localStorage.getItem(QKEY) || '[]') || []; } catch {}
    queue.push({ todoId: id, completedAt: Date.now(), addTimeSpent: Number(addSeconds) || 0 });
    try { localStorage.setItem(QKEY, JSON.stringify(queue.slice(-50))); } catch {}
    // Optimistically remove from local cache so the suggestion vanishes now.
    try {
      const raw = localStorage.getItem('personal-todos-cache');
      if (raw) {
        const cache = JSON.parse(raw) || {};
        cache.items = (cache.items || []).filter(i => i.id !== id);
        localStorage.setItem('personal-todos-cache', JSON.stringify(cache));
      }
    } catch {}
  }

  // Quarterly goals live in localStorage — write directly.
  function completeGoalActionItem(sel){
    const goalId = sel.ids && sel.ids.goalId;
    const taskId = sel.ids && sel.ids.taskId;
    if (!goalId || !taskId) return;
    try {
      const raw = localStorage.getItem('quarterly-goals-v1');
      if (!raw) return;
      const data = JSON.parse(raw) || {};
      const goal = (data.goals || []).find(g => g.id === goalId);
      if (!goal) return;
      const ai = (goal.actionItems || []).find(x => x.id === taskId);
      if (!ai) return;
      ai.done = true;
      ai.completedAt = new Date().toISOString();
      goal.updatedAt = new Date().toISOString();
      const s = JSON.stringify(data);
      localStorage.setItem('quarterly-goals-v1', s);
      // If the host page exposes a sync client, give it a nudge.
      if (window.parent && window.parent.syncClient && typeof window.parent.syncClient.push === 'function') {
        try { window.parent.syncClient.push('quarterly-goals-v1', s); } catch {}
      }
    } catch {}
  }

  // Board action items live in localStorage — same pattern.
  function completeBoardActionItem(sel){
    const { boardId, goalId, taskId } = sel.ids || {};
    if (!boardId || !goalId || !taskId) return;
    try {
      const raw = localStorage.getItem('goal-board-v2');
      if (!raw) return;
      const data = JSON.parse(raw) || {};
      const board = (data.boards || []).find(b => b.id === boardId);
      if (!board) return;
      const goal = (board.goals || []).find(g => g.id === goalId);
      if (!goal) return;
      const ai = (goal.actionItems || []).find(x => x.id === taskId);
      if (!ai) return;
      ai.done = true;
      ai.completedAt = new Date().toISOString();
      goal.updatedAt = new Date().toISOString();
      const s = JSON.stringify(data);
      localStorage.setItem('goal-board-v2', s);
      if (window.parent && window.parent.syncClient && typeof window.parent.syncClient.push === 'function') {
        try { window.parent.syncClient.push('goal-board-v2', s); } catch {}
      }
    } catch {}
  }

  // Today's plan in localStorage.
  function completePlanItem(sel){
    const id = sel.ids && sel.ids.planId;
    if (!id) return;
    try {
      const raw = localStorage.getItem('daily-plan');
      if (!raw) return;
      const plan = JSON.parse(raw) || {};
      const today = todayKeyChi();
      const list = Array.isArray(plan[today]) ? plan[today] : [];
      const it = list.find(x => x.id === id);
      if (!it) return;
      it.done = true;
      it.completedAt = new Date().toISOString();
      localStorage.setItem('daily-plan', JSON.stringify(plan));
    } catch {}
  }

  // Manual / free-text tasks don't have a stable ID — at start we created a
  // personal todo via a queue; at finish we ask personal-todos to mark the
  // matching todo done by text. Personal-todos drains both shapes.
  function queuePersonalCompletionByText(text, addSeconds){
    const t = (text || '').trim();
    if (!t) return;
    try {
      const QKEY = 'sprint-pending-completions';
      const queue = JSON.parse(localStorage.getItem(QKEY) || '[]') || [];
      queue.push({ text: t, completedAt: Date.now(), addTimeSpent: Number(addSeconds) || 0 });
      localStorage.setItem(QKEY, JSON.stringify(queue.slice(-50)));
    } catch {}
  }

  // Wrapper used by finishSprint AND by the override flow. If the entry was
  // linked to a source task, mark that source done; otherwise queue a
  // completion-by-text for the manually-typed task.
  function completeBeyondSprint(entry, sel){
    if (!entry) return;
    const addSecs = Number(entry && entry.actualSeconds) || 0;
    if (sel && sel.source && sel.source !== 'recent') {
      try {
        // Personal-todo path uses the queue with addTimeSpent; goal/board/plan
        // use synchronous localStorage and don't track time the same way, so
        // pass through but completePersonalTodo extracts addSecs only.
        if (sel.source === 'personal' || sel.source === 'priority') {
          completePersonalTodo(sel, addSecs);
        } else {
          completeSourceTask(sel);
        }
      } catch (e) { console.warn('source completion failed', e); }
    } else {
      // Manual task — match by text on personal todos. Pass actualSeconds so
      // personal-todos can bump the matched todo's timeSpent.
      try { queuePersonalCompletionByText(entry.taskName, addSecs); } catch {}
    }
  }

  // ============ FINISH ============
  function finishSprint(hitDone){
    if (!timerHandle) return;
    clearInterval(timerHandle); timerHandle = null;
    document.title = 'Sprint — War Room';
    const now = Date.now();
    const actualSeconds = Math.round((now - startedAt) / 1000);
    const won = hitDone && actualSeconds <= targetSeconds;
    // Record history. Persist source IDs so a later override can re-fire the
    // global completion (when the user retroactively marks a forgotten task).
    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      taskName: currentTask,
      targetSeconds,
      actualSeconds,
      won,
      pauseCount,
      sourceLinked: !!(selectedTask && selectedTask.source && selectedTask.source !== 'recent'),
      sourceType: (selectedTask && selectedTask.source) || '',
      sourceIds: (selectedTask && selectedTask.ids) ? { ...selectedTask.ids } : null,
      completedAt: new Date().toISOString(),
    };
    // When user hits "I'm Done", complete globally regardless of win/loss —
    // a slow finish still counts as the task being done. Linked tasks → mark
    // source done; manual tasks → queue a text-match completion for personal-todos.
    if (hitDone) {
      try { completeBeyondSprint(entry, selectedTask); } catch (e) { console.warn('completion failed', e); }
    }
    store.history.push(entry);
    // Keep history under 500 entries to avoid localStorage bloat
    if (store.history.length > 500) store.history = store.history.slice(-500);
    if (won) {
      store.currentStreak += 1;
      if (store.currentStreak > store.bestStreak) store.bestStreak = store.currentStreak;
    } else {
      store.currentStreak = 0;
    }
    saveStore(store);
    // Sprint is done — clear any paused state and reset counter.
    clearPaused();
    pauseCount = 0;
    renderResumeBanner();
    // Release fullscreen if WE took it for this sprint.
    if (sprintTookFullscreen) {
      sprintTookFullscreen = false;
      releaseParentFullscreen();
    }
    renderStats();
    showResult(entry);
  }
  doneBtn.addEventListener('click', () => finishSprint(true));
  quitBtn.addEventListener('click', () => {
    if (!confirm("Quit this sprint? It won't be recorded.")) return;
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = null;
    document.title = 'Sprint — War Room';
    // Quit also drops any pause state for this run
    clearPaused();
    pauseCount = 0;
    renderResumeBanner();
    if (sprintTookFullscreen) {
      sprintTookFullscreen = false;
      releaseParentFullscreen();
    }
    showView('play');
  });

  // ============ RESULT ============
  function showResult(entry){
    const won = entry.won;
    const remain = Math.max(0, entry.targetSeconds - entry.actualSeconds);
    const over = Math.max(0, entry.actualSeconds - entry.targetSeconds);
    resultOverlay.classList.remove('win','lose');
    resultOverlay.classList.add(won ? 'win' : 'lose');
    if (won) {
      // Pick a fun headline based on remaining time
      const pct = remain / entry.targetSeconds;
      let head, emoji;
      if (pct >= .5)        { head = 'BLOWOUT!';      emoji = '🚀'; }
      else if (pct >= .25)  { head = 'CRUSHED IT!';   emoji = '🏆'; }
      else if (pct >= .1)   { head = 'BEAT IT!';      emoji = '🔥'; }
      else                  { head = 'PHOTO FINISH!'; emoji = '⚡'; }
      resultEmoji.textContent = emoji;
      resultHeadline.textContent = head;
      resultSub.textContent = `${fmtFriendly(remain)} to spare on "${entry.taskName}"`;
      resultStats.innerHTML = `
        <div class="result-stat hero"><div class="v">${fmtMMSS(entry.actualSeconds)}</div><div class="l">Your Time</div></div>
        <div class="result-stat"><div class="v">${fmtMMSS(entry.targetSeconds)}</div><div class="l">Target</div></div>
      `;
      if (store.currentStreak > 1) {
        resultStreak.style.display = '';
        resultStreak.classList.remove('broken');
        resultStreak.innerHTML = `🔥 <strong>${store.currentStreak} in a row</strong>${store.currentStreak===store.bestStreak?` &nbsp;·&nbsp; new best!`:''}`;
      } else {
        resultStreak.style.display = '';
        resultStreak.classList.remove('broken');
        resultStreak.innerHTML = `🔥 <strong>Streak started</strong>`;
      }
      playWinFanfare();
      fireConfetti();
    } else {
      resultEmoji.textContent = '😤';
      resultHeadline.textContent = "TIME'S UP";
      resultSub.textContent = `Logged "${entry.taskName}" — went ${fmtFriendly(over)} over. Beat it next time.`;
      resultStats.innerHTML = `
        <div class="result-stat"><div class="v">${fmtMMSS(entry.actualSeconds)}</div><div class="l">Your Time</div></div>
        <div class="result-stat"><div class="v">${fmtMMSS(entry.targetSeconds)}</div><div class="l">Target</div></div>
      `;
      if (store.currentStreak === 0 && store.history.length >= 2) {
        const prev = store.history[store.history.length - 2];
        if (prev && prev.won) {
          resultStreak.style.display = '';
          resultStreak.classList.add('broken');
          resultStreak.innerHTML = `Streak ended at <strong>${store.bestStreak}</strong>`;
        } else {
          resultStreak.style.display = 'none';
        }
      } else {
        resultStreak.style.display = 'none';
      }
      playLoseSound();
    }
    // Show the override form on losses (so user can fix "I forgot to hit Done")
    const ovr = $('resultOverride');
    const ovrForm = $('overrideForm');
    if (ovr) {
      ovr.style.display = won ? 'none' : '';
      // Stash the entry id so the override action knows which entry to update
      ovr.dataset.entryId = entry.id;
    }
    if (ovrForm) ovrForm.style.display = 'none';
    resultOverlay.classList.add('show');
  }

  // ============ OVERRIDE: convert a loss into a win retroactively ============
  // User claims they actually finished by some time but forgot to hit Done.
  // Validates that the claimed time is ≤ target, then patches the entry, fixes
  // streak, and re-shows the result as a win (with confetti).
  function applyOverrideToEntry(entry, newSeconds){
    if (!entry || entry.won) return false;
    if (!Number.isFinite(newSeconds) || newSeconds <= 0) return false;
    if (newSeconds > entry.targetSeconds) {
      alert(`That's still over the target (${fmtMMSS(entry.targetSeconds)}). Override needs to be ≤ target.`);
      return false;
    }
    entry.actualSeconds = newSeconds;
    entry.won = true;
    entry.overridden = true;
    entry.overriddenAt = new Date().toISOString();
    // Recompute streak from full history (the simplest correct approach).
    let cs = 0, best = store.bestStreak || 0;
    store.history.forEach(h => {
      if (h.won) { cs += 1; if (cs > best) best = cs; }
      else cs = 0;
    });
    store.currentStreak = cs;
    store.bestStreak = best;
    saveStore(store);
    // ALSO complete globally — this is what "I actually finished on time" means:
    // the task was done, just not logged. Fire the same completion path the Done
    // button would have fired at the original finish moment.
    const sel = (entry.sourceType && entry.sourceType !== 'recent' && entry.sourceIds)
      ? { source: entry.sourceType, ids: entry.sourceIds, text: entry.taskName }
      : null;
    try { completeBeyondSprint(entry, sel); } catch (e) { console.warn('override completion failed', e); }
    return true;
  }
  function overrideMostRecentEntry(){
    const ovr = $('resultOverride');
    const id = ovr && ovr.dataset.entryId;
    if (!id) return;
    const entry = store.history.find(h => h.id === id);
    if (!entry) return;
    const minEl = $('overrideMin'), secEl = $('overrideSec');
    const m = parseInt(minEl.value, 10) || 0;
    const s = parseInt(secEl.value, 10) || 0;
    const newSeconds = m * 60 + s;
    if (!applyOverrideToEntry(entry, newSeconds)) return;
    renderStats();
    // Re-show as a win
    showResult(entry);
    fireConfetti();
    playWinFanfare();
  }
  if ($('overrideOpenBtn')) $('overrideOpenBtn').addEventListener('click', () => {
    const f = $('overrideForm');
    if (f) f.style.display = '';
    setTimeout(() => $('overrideMin')?.focus(), 30);
  });
  if ($('overrideCancelBtn')) $('overrideCancelBtn').addEventListener('click', () => {
    const f = $('overrideForm');
    if (f) f.style.display = 'none';
  });
  if ($('overrideConfirmBtn')) $('overrideConfirmBtn').addEventListener('click', overrideMostRecentEntry);
  // Enter to confirm
  ['overrideMin','overrideSec'].forEach(id => {
    const el = $(id);
    if (el) el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); overrideMostRecentEntry(); } });
  });
  againBtn.addEventListener('click', () => {
    resultOverlay.classList.remove('show');
    // Clear selection so user can pick a new task; pre-fill input with last name
    // for quick re-race of free-text tasks.
    setSelectedTask(null);
    showView('play');
    if (lastTaskName) taskInput.value = lastTaskName;
    setTimeout(() => taskInput.focus(), 100);
  });
  homeBtn.addEventListener('click', () => {
    resultOverlay.classList.remove('show');
    setSelectedTask(null);
    showView('play');
  });

  // ============ CONFETTI ============
  const confettiCanvas = $('confetti');
  const cctx = confettiCanvas.getContext('2d');
  let confettiPieces = [];
  let confettiRaf = null;
  function resizeConfetti(){
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeConfetti);
  resizeConfetti();
  function fireConfetti(){
    const colors = ['#FF8A3D','#FFB07F','#4ADE80','#FBBF24','#F87171','#A78BFA','#5AC8FA','#FFFFFF'];
    const count = 180;
    confettiPieces = [];
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() * .4 - .2);
      const v = 6 + Math.random() * 9;
      confettiPieces.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * v,
        vy: Math.sin(angle) * v - 4,
        size: 4 + Math.random() * 6,
        color: colors[(Math.random() * colors.length) | 0],
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - .5) * .3,
        life: 1,
      });
    }
    if (confettiRaf) cancelAnimationFrame(confettiRaf);
    const startTs = performance.now();
    function step(ts){
      const elapsed = ts - startTs;
      cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      let alive = 0;
      for (const p of confettiPieces) {
        p.vy += .25; // gravity
        p.x += p.vx; p.y += p.vy;
        p.vx *= .995;
        p.rot += p.vRot;
        p.life = Math.max(0, 1 - elapsed / 2800);
        if (p.life > 0 && p.y < confettiCanvas.height + 40) alive++;
        cctx.save();
        cctx.translate(p.x, p.y);
        cctx.rotate(p.rot);
        cctx.globalAlpha = p.life;
        cctx.fillStyle = p.color;
        cctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .5);
        cctx.restore();
      }
      if (alive > 0) {
        confettiRaf = requestAnimationFrame(step);
      } else {
        cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        confettiPieces = [];
        confettiRaf = null;
      }
    }
    confettiRaf = requestAnimationFrame(step);
  }

  // ============ HISTORY VIEW ============
  function renderHistory(){
    const items = store.history.slice().reverse();
    if (items.length === 0) {
      historyView.innerHTML = `<div class="history-empty"><span class="icon">⏱</span>No sprints yet. Race your first task to start building a streak.</div>`;
      return;
    }
    const rows = items.map(h => {
      const won = h.won;
      const dt = new Date(h.completedAt);
      const when = dt.toLocaleString('en-US', { timeZone:'America/Chicago', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
      const delta = h.targetSeconds - h.actualSeconds;
      const deltaStr = delta >= 0 ? `${fmtFriendly(delta)} early` : `${fmtFriendly(-delta)} over`;
      const pauseStr = h.pauseCount && h.pauseCount > 0
        ? ` · ${h.pauseCount} pause${h.pauseCount===1?'':'s'}`
        : '';
      const overrideTag = h.overridden ? ` · <span style="color:var(--accent);font-weight:800">overridden</span>` : '';
      // Loss rows get an "Override" button so users can flip a forgotten Done
      const overrideBtn = !won
        ? `<button class="h-override-btn" data-id="${escapeAttr(h.id)}" title="Mark as completed on time">Override</button>`
        : '';
      return `
        <div class="h-row ${won?'win':'lose'}">
          <span class="h-icon">${won?'🏆':'⏰'}</span>
          <div class="h-body">
            <div class="h-task">${escapeHtml(h.taskName)}</div>
            <div class="h-meta">${when} · target ${fmtFriendly(h.targetSeconds)} · ${deltaStr}${pauseStr}${overrideTag}</div>
          </div>
          <div class="h-time"><span class="actual">${fmtMMSS(h.actualSeconds)}</span></div>
          <span class="h-result ${won?'win':'lose'}">${won?'Win':'Loss'}</span>
          ${overrideBtn}
        </div>
      `;
    }).join('');
    historyView.innerHTML = rows + `<div class="history-actions"><button class="btn-clear" id="clearBtn">Clear history</button></div>`;
    // Wire Override buttons on loss rows
    historyView.querySelectorAll('.h-override-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const entry = store.history.find(h => h.id === id);
        if (!entry) return;
        const target = fmtMMSS(entry.targetSeconds);
        const ans = prompt(`Actual finish time for "${entry.taskName}"?\nTarget was ${target} (m:ss). Enter as MM:SS or just minutes.`, target);
        if (ans == null) return;
        // Parse MM:SS or plain minutes
        let secs = 0;
        const parts = String(ans).trim().split(':');
        if (parts.length === 2) {
          secs = (parseInt(parts[0],10) || 0) * 60 + (parseInt(parts[1],10) || 0);
        } else {
          secs = (parseFloat(parts[0]) || 0) * 60;
          secs = Math.round(secs);
        }
        if (applyOverrideToEntry(entry, secs)) {
          renderStats();
          renderHistory();
        }
      });
    });
    const cb = $('clearBtn');
    if (cb) cb.onclick = () => {
      if (!confirm("Clear all sprint history? This can't be undone.")) return;
      store.history = [];
      store.currentStreak = 0;
      saveStore(store);
      renderStats();
      renderHistory();
    };
  }

  // ============ KEYBOARD ============
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (resultOverlay.classList.contains('show')) {
        resultOverlay.classList.remove('show');
        showView('play');
      }
    }
    // Spacebar to mark done during game
    if (e.key === ' ' && gameView.style.display !== 'none' && !resultOverlay.classList.contains('show')) {
      e.preventDefault();
      finishSprint(true);
    }
  });

  // Prevent accidental tab close while sprint is running
  window.addEventListener('beforeunload', (e) => {
    if (timerHandle) {
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
  });

  // ============ LOFI MUSIC ============
  // Curated YouTube videos/streams. If any goes offline, swap its `videoId`
  // for a working URL — the rest of the system doesn't care.
  const VIBES = [
    { id:'hiphop',    label:'Hip-Hop',        videoId:'jfKfPfyJRdk' }, // Lofi Girl - lofi hip hop radio (iconic 24/7)
    { id:'anime',     label:'Anime Openings', videoId:'leg3dJ4Xl_Q' }, // "Popular Anime Openings But It's Lofi Remix"
    { id:'ghibli',    label:'OPs Extended',   videoId:'GNWLILeztaI' }, // "best anime openings but it's lofi remix extended edition (2 hours)"
    { id:'animehits', label:'Frieren Lofi',   videoId:'eGCLSr2OyaM' }, // "Frieren & Lo-fi - Echoes of an Endless Journey"
    { id:'chillhop',  label:'Chillhop',       videoId:'5yx6BWlEVcY' }, // Chillhop Music - jazzy & lofi
    { id:'jazz',      label:'Jazz Lofi',      videoId:'Dx5qFachd3A' }, // Lofi Girl - jazz lofi
    { id:'synthwave', label:'Synthwave',      videoId:'4xDzrJKXOOY' }, // Lofi Girl - synthwave radio
  ];
  const MUSIC_KEY = 'sprint-music-v1';
  const musicState = (function(){
    try {
      const raw = localStorage.getItem(MUSIC_KEY);
      if (!raw) return { vibe:null, customId:'' };
      const d = JSON.parse(raw) || {};
      return { vibe: d.vibe || null, customId: d.customId || '' };
    } catch { return { vibe:null, customId:'' }; }
  })();
  function saveMusicState(){ try { localStorage.setItem(MUSIC_KEY, JSON.stringify(musicState)); } catch {} }

  const musicBar = $('musicBar');
  const musicVibesEl = $('musicVibes');
  const musicFrame = $('musicFrame');
  const musicStopBtn = $('musicStopBtn');
  const musicCustomBtn = $('musicCustomBtn');
  const musicCustomEl = $('musicCustom');
  const musicCustomInput = $('musicCustomInput');
  const musicCustomPlayBtn = $('musicCustomPlayBtn');
  const musicCustomClearBtn = $('musicCustomClearBtn');

  function renderVibeChips(){
    musicVibesEl.innerHTML = VIBES.map(v => `
      <button class="vibe-chip ${musicState.vibe===v.id?'active':''}" data-vibe="${v.id}">${escapeHtml(v.label)}</button>
    `).join('');
    musicVibesEl.querySelectorAll('.vibe-chip').forEach(el => {
      el.addEventListener('click', () => {
        const vid = el.dataset.vibe;
        // Clicking the active chip again stops the music
        if (musicState.vibe === vid) { stopMusic(); return; }
        playVibe(vid);
      });
    });
  }

  function applyMusicUI(){
    musicBar.classList.toggle('playing', !!musicState.vibe);
    renderVibeChips();
  }

  // Resolve a free-text input (URL or bare ID) into an 11-char YouTube ID.
  // Accepts: youtube.com/watch?v=ID, youtu.be/ID, /embed/ID, /shorts/ID, or a plain ID.
  function parseYouTubeId(raw){
    const s = (raw || '').trim();
    if (!s) return '';
    if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
    const m = s.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?v=|embed\/|shorts\/|v\/))([A-Za-z0-9_-]{11})/);
    return m ? m[1] : '';
  }

  // Rotate to the next vibe — used when the current video ends. Skips back to
  // the first vibe after the last. If the user was on a custom ID, fall back
  // to vibe 0 (we don't have a list of custom IDs to rotate through).
  function nextVibeId(currentId){
    const i = VIBES.findIndex(v => v.id === currentId);
    if (i === -1) return VIBES[0].id;
    return VIBES[(i + 1) % VIBES.length].id;
  }

  function playVideoId(videoId, vibeId){
    if (!videoId) return;
    musicState.vibe = vibeId || null;
    musicState.customId = vibeId ? '' : videoId;
    saveMusicState();
    // Random start offset (60s..1500s = 1..25 min in)
    const startAt = 60 + Math.floor(Math.random() * 1440);
    // enablejsapi=1 lets us listen for state changes (ENDED → rotate).
    // Origin must match for postMessage handshake.
    const origin = encodeURIComponent(window.location.origin);
    const src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&playsinline=1&modestbranding=1&rel=0&mute=0&start=${startAt}&enablejsapi=1&origin=${origin}`;
    musicFrame.src = src;
    applyMusicUI();
  }

  // Listen for the YT IFrame Player API "ended" event. The API posts JSON
  // strings to window.postMessage; we filter on the iframe source + event name.
  window.addEventListener('message', (ev) => {
    if (!ev || !ev.data) return;
    // YT API messages come as JSON strings from youtube-nocookie.com
    let payload = ev.data;
    if (typeof payload === 'string') {
      try { payload = JSON.parse(payload); } catch { return; }
    }
    if (!payload || payload.event !== 'onStateChange') return;
    // YT.PlayerState.ENDED === 0
    if (payload.info !== 0) return;
    // Only react if we're actually playing music (vibe or custom)
    if (!musicState.vibe && !musicState.customId) return;
    // Rotate to next vibe (also covers the custom-id case — we fall to vibe 0)
    const next = nextVibeId(musicState.vibe);
    playVibe(next);
  });

  // Once the iframe loads, kick the YT API into "listening" mode so it sends us
  // state-change messages. Without this handshake, no events arrive.
  function bindYtListening(){
    try {
      if (musicFrame.src && musicFrame.src !== 'about:blank' && musicFrame.contentWindow) {
        musicFrame.contentWindow.postMessage(
          JSON.stringify({ event:'listening', id:'sprint-music' }),
          '*'
        );
      }
    } catch {}
  }
  if (musicFrame) musicFrame.addEventListener('load', bindYtListening);

  function playVibe(vibeId){
    const v = VIBES.find(x => x.id === vibeId);
    if (!v) return;
    playVideoId(v.videoId, vibeId);
  }

  function playCustom(){
    const raw = (musicCustomInput.value || '').trim();
    const id = parseYouTubeId(raw);
    if (!id) {
      musicCustomInput.style.borderColor = 'var(--bad)';
      setTimeout(() => { musicCustomInput.style.borderColor = ''; }, 1200);
      return;
    }
    playVideoId(id, null);
  }

  function stopMusic(){
    musicState.vibe = null;
    musicState.customId = '';
    saveMusicState();
    musicFrame.src = 'about:blank'; // unload to actually stop audio
    applyMusicUI();
  }

  function toggleCustomRow(){
    musicCustomEl.classList.toggle('show');
    musicCustomBtn.classList.toggle('active', musicCustomEl.classList.contains('show'));
    if (musicCustomEl.classList.contains('show')) {
      setTimeout(() => musicCustomInput.focus(), 30);
    }
  }

  if (musicStopBtn) musicStopBtn.addEventListener('click', stopMusic);
  if (musicCustomBtn) musicCustomBtn.addEventListener('click', toggleCustomRow);
  if (musicCustomPlayBtn) musicCustomPlayBtn.addEventListener('click', playCustom);
  if (musicCustomClearBtn) musicCustomClearBtn.addEventListener('click', () => {
    musicCustomInput.value = '';
    musicCustomInput.focus();
  });
  if (musicCustomInput) musicCustomInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); playCustom(); }
  });

  // On load, KEEP the saved vibe/customId so the chip stays visually active —
  // user expects "the music I had on" to come back after refresh. We can't
  // actually play audio yet (browsers require a user gesture), so we attach
  // a one-time listener to resume playback on the first interaction with the
  // page (any click/tap/keypress). Until then, the chip glows but is silent.
  if (musicState.customId && musicCustomInput) {
    musicCustomInput.value = musicState.customId;
  }
  applyMusicUI();
  if (musicState.vibe || musicState.customId) {
    const resumeMusic = () => {
      try {
        if (musicState.customId) playVideoId(musicState.customId, null);
        else if (musicState.vibe) playVibe(musicState.vibe);
      } catch {}
      document.removeEventListener('pointerdown', resumeMusic, true);
      document.removeEventListener('keydown', resumeMusic, true);
      document.removeEventListener('touchstart', resumeMusic, true);
    };
    document.addEventListener('pointerdown', resumeMusic, true);
    document.addEventListener('keydown', resumeMusic, true);
    document.addEventListener('touchstart', resumeMusic, true);
  }

  // ============ INIT ============
  renderStats();
  renderResumeBanner();
  renderSuggestions();

  // Re-render when sync-client finishes pulling cloud state. Without this,
  // Sprint's first render uses STALE localStorage (sync hasn't completed yet)
  // and the user sees old data until they tap a filter chip (which re-reads).
  document.addEventListener('warroom:cloud-ready', () => {
    try { renderStats(); renderSuggestions(); } catch {}
  });

  // Cross-iframe cache changes (Personal todo added/checked off, goals edit,
  // daily-plan tweak) — re-render Sprint immediately so it stays in sync
  // without needing a manual refresh.
  const SYNCED_CACHE_KEYS = new Set([
    'personal-todos-cache',
    'quarterly-goals-v1',
    'goal-board-v2',
    'daily-plan',
    'sprint-history-v1',
  ]);
  window.addEventListener('storage', (e) => {
    if (!e || !e.key) return;
    if (SYNCED_CACHE_KEYS.has(e.key)) {
      try { renderStats(); renderSuggestions(); } catch {}
    }
  });

  // Also re-render when Sprint becomes visible again (parent shell switches
  // to this tab, or user toggles fullscreen). The visibilitychange event
  // fires for the iframe document on tab activation in many browsers.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      try { renderStats(); renderSuggestions(); } catch {}
    }
  });
  window.addEventListener('focus', () => {
    try { renderStats(); renderSuggestions(); } catch {}
  });
  // Pre-fill task from URL ?task=...
  try {
    const sp = new URLSearchParams(location.search);
    const t = sp.get('task');
    if (t) taskInput.value = t;
    const tgt = parseInt(sp.get('min') || '', 10);
    if (Number.isFinite(tgt) && tgt > 0) {
      targetSeconds = tgt * 60;
      targetChips.querySelectorAll('.target-chip').forEach(c => {
        c.classList.toggle('active', parseInt(c.dataset.min, 10) === tgt);
      });
      // If no chip matched, write to custom
      if (!targetChips.querySelector('.target-chip.active')) {
        targetCustom.value = tgt;
      }
    }
    // Race mode: this Sprint instance is running as a fullscreen overlay
    // launched from Personal. Hide its music bar (Personal owns the music)
    // and post warroom:race-done to the parent when the user finishes,
    // so the overlay can close itself.
    const isRaceMode = sp.get('race') === '1';
    const noMusic = sp.get('nomusic') === '1';
    const todoIdParam = sp.get('todoId') || '';
    // Slot id (1 or 2) — used by the parent to close just THIS race when
    // running split-screen sprints. Defaults to 1 if absent (legacy single-race).
    const raceSlot = parseInt(sp.get('slot') || '1', 10) || 1;
    if (noMusic) {
      const mb = document.getElementById('musicBar'); if (mb) mb.style.display = 'none';
      const mfw = document.getElementById('musicFrame'); if (mfw) mfw.src = 'about:blank';
    }
    if (isRaceMode) {
      // Persist the last target so re-races default sensibly
      if (Number.isFinite(tgt) && tgt > 0) {
        try { localStorage.setItem('sprint-last-target-min', String(tgt)); } catch {}
      }
      // Auto-select the URL task as a "personal" linked task so the completion
      // path bumps timeSpent on the right todo. We piggyback on selectedTask.
      if (t && todoIdParam) {
        try {
          setSelectedTask({
            text: t, source: 'personal', jobId: '', jobLabel: 'PERSONAL',
            date: '', ids: { todoId: todoIdParam }, details: ''
          });
        } catch {}
      }
      // Tell parent to close the overlay when the sprint finishes (any path).
      // Hook into the result overlay being shown — that's the universal "done" signal.
      const ro = document.getElementById('resultOverlay');
      if (ro) {
        const obs = new MutationObserver(() => {
          if (ro.classList.contains('show')) {
            try { window.parent && window.parent.postMessage({ type:'warroom:race-done', slot: raceSlot }, '*'); } catch {}
          }
        });
        obs.observe(ro, { attributes: true, attributeFilter: ['class'] });
      }
      // Esc inside race overlay → also signal close
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          try { window.parent && window.parent.postMessage({ type:'warroom:race-close', slot: raceSlot }, '*'); } catch {}
        }
      });
    }
  } catch {}
})();
</script>
</body>
</html>
