      // Checkbox: toggle selection without expanding
      if (e.target.closest('[data-check]')) {
        e.stopPropagation();
        if (selectedAckIds.has(r.id)) selectedAckIds.delete(r.id);
        else selectedAckIds.add(r.id);
        renderBulkBar();
        render();
        return;
      }
      // Inline ack button on the row head (only shown in ack view)
      if (e.target.closest('[data-ack]')) {
        e.stopPropagation();
        handleAck(r.id);
        return;
      }
      setExpanded(r.id);
    });
    if (expandedId === r.id) {
      // Wire field handlers
      row.querySelectorAll('[data-field]').forEach(el => {
        el.addEventListener('click', e => e.stopPropagation());
        const fieldName = el.dataset.field;
        const isSelect = el.tagName === 'SELECT';
        const evt = isSelect ? 'change' : 'blur';
        el.addEventListener(evt, async () => {
          const v = el.value;
          // Detect if value actually changed
          const local = (fieldName === 'Status') ? r.status
                      : fieldName === 'Ticket #' ? String(r.ticket || '').replace(/\.0$/, '')
                      : fieldName === 'Details' ? r.details
                      : fieldName === 'Outcome Details' ? r.outcome
                      : fieldName === 'Task Name' ? r.task
                      : fieldName === 'Owner' ? r.owner
                      : fieldName === 'Completion Date' ? (r.completionDate || '').slice(0, 10)
                      : '';
          if ((local || '') === (v || '')) return;
          await pushField(r, fieldName, v, row);
        });
      });
      row.querySelector('[data-collapse]').addEventListener('click', (e) => {
        e.stopPropagation(); setExpanded(r.id);
      });
      // Drawer-level Acknowledge / Un-ack buttons
      row.querySelectorAll('[data-ack]').forEach(b => b.addEventListener('click', (e) => {
        e.stopPropagation();
        handleAck(r.id);
      }));
      // "Ack as <selected>" — reads the adjacent dropdown's value so the user
      // can ack on someone else's behalf without switching identity.
      row.querySelectorAll('[data-ack-with]').forEach(b => b.addEventListener('click', (e) => {
        e.stopPropagation();
        const sel = row.querySelector('.ack-as-select');
        const pickedName = sel ? sel.value.trim() : '';
        handleAck(r.id, pickedName || _userName || '');
      }));
      row.querySelectorAll('[data-unack]').forEach(b => b.addEventListener('click', (e) => {
        e.stopPropagation();
        handleUnack(r.id);
      }));
      // Internal-only toggle — writes BOTH to Firestore (fast team sync) and
      // to the Smartsheets "Internal Only" checkbox column (durable source of
      // truth). Either write failing doesn't roll back the other; user can
      // re-toggle to retry.
      row.querySelectorAll('[data-internal]').forEach(b => b.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = r.id;
        const wasOn = !!internalFlags[id];
        if (wasOn) {
          delete internalFlags[id];
          r.internalSS = false;
          render();
          try { await window._ecmInternal.unmarkInternal(id); }
          catch (err) { console.error('unmark internal failed', err); }
          try { await pushInternalToSheet(r, false); }
          catch (err) { console.error('unmark internal SS push failed', err); }
        } else {
          const name = ensureUserName();
          internalFlags[id] = { internal: true, markedBy: name || '', markedAt: new Date().toISOString() };
          r.internalSS = true;
          render();
          try { await window._ecmInternal.markInternal(id, name); }
          catch (err) { console.error('mark internal failed', err); }
          try { await pushInternalToSheet(r, true); }
          catch (err) { console.error('mark internal SS push failed', err); }
        }
      }));
    }
    list.appendChild(row);
  });
}

// Ack / un-ack handlers — Firestore writes, optimistic state update.
// Ack a row. Optional name override (used by the drawer's "Ack as" dropdown).
// Without it, falls back to the current user — opening the name picker if
// no current user is set yet.
async function handleAck(rowId, nameOverride){
  const proceed = async (name) => {
    if (!name) return;
    acks[rowId] = { ackedBy: name, ackedAt: new Date().toISOString(), rowId: String(rowId) };
    selectedAckIds.delete(rowId);
    render();
    try { await window._ecmAcks.ackRow(rowId, name); }
    catch (e) { console.error('ack failed', e); alert('Couldn\'t save ack — try again'); }
  };
  if (nameOverride) return proceed(nameOverride);
  if (_userName) return proceed(_userName);
  ensureUserName(name => { if (name) proceed(name); });
}
async function handleUnack(rowId){
  delete acks[rowId];
  render();
  try { await window._ecmAcks.unackRow(rowId); }
  catch (e) { console.error('un-ack failed', e); }
}
// Bulk acknowledge — ack everything currently selected. Opens the name picker
// if no current user is set yet.
async function bulkAck(){
  const proceed = async (name) => {
    if (!name) return;
    const ids = Array.from(selectedAckIds);
    if (!ids.length) return;
    const nowIso = new Date().toISOString();
    ids.forEach(id => { acks[id] = { ackedBy: name, ackedAt: nowIso, rowId: String(id) }; });
    selectedAckIds.clear();
    renderBulkBar();
    render();
    try { await Promise.all(ids.map(id => window._ecmAcks.ackRow(id, name))); }
    catch (e) { console.error('bulk ack partial fail', e); }
  };
  if (_userName) return proceed(_userName);
  ensureUserName(name => { if (name) proceed(name); });
}
function renderBulkBar(){
  const bar = document.getElementById('bulkBar');
  if (!bar) return;
  const n = selectedAckIds.size;
  if (n > 0) {
    bar.classList.add('show');
    const ct = document.getElementById('bulkCount');
    if (ct) ct.textContent = `${n} selected`;
  } else {
    bar.classList.remove('show');
  }
}
function updateNeedsAckDot(){
  const dot = document.getElementById('needsAckDot');
  if (!dot) return;
  // Exclude dev/report items — they live on the Dev/Reports tab and don't
  // count as standard ECM ack work.
  const needsCount = rows.filter(r => !acks[r.id] && !isDevOrReportRow(r)).length;
  dot.classList.toggle('show', needsCount > 0);
}
// Per-owner pending-ack counts — small avatar pills showing each owner with
// open (un-acked, non-completed) rows. Tap a pill to filter the list to that
// owner. Auto-discovered from the data — no hardcoded names.
function renderOwnerAcks(){
  const el = document.getElementById('ownerAcks');
  if (!el) return;
  // Count un-acked open rows per owner. "Open" = not Completed / Not feasible.
  // Exclude dev/report items from the count — they're tracked on the
  // Dev/Reports tab so they shouldn't inflate the standard owner queue.
  const counts = {};
  rows.forEach(r => {
    if (!r.owner) return;
    if (acks[r.id]) return;
    if (r.status === 'Completed' || r.status === 'Not feasible - close ticket') return;
    if (isDevOrReportRow(r)) return;
    counts[r.owner] = (counts[r.owner] || 0) + 1;
  });
  const owners = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  if (!owners.length) {
    el.innerHTML = '';
    return;
  }
  el.innerHTML = owners.map(o => {
    const n = counts[o];
    const init = ownerInitials(o);
    const col = ownerColor(o);
    const first = ownerFirstName(o);
    const active = filterOwner === o ? 'active' : '';
    const zero = n === 0 ? 'zero' : '';
    return `<button type="button" class="owner-ack-pill ${active} ${zero}" data-owner-ack="${escHtml(o)}" title="${escHtml(o)} — ${n} task${n === 1 ? '' : 's'} to acknowledge">
      <span class="avatar" style="background:${col}">${escHtml(init)}</span>
      <span>${escHtml(first)}</span>
      <span class="ct">${n}</span>
    </button>`;
  }).join('');
  el.querySelectorAll('[data-owner-ack]').forEach(b => {
    b.addEventListener('click', () => {
      const o = b.getAttribute('data-owner-ack') || '';
      // Toggle filter — tap active pill again to clear
      filterOwner = (filterOwner === o) ? '' : o;
      // Sync the owner select dropdown so it stays consistent
      const sel = document.getElementById('ownerSelect');
      if (sel) sel.value = filterOwner;
      render();
    });
  });
}

// Dev / Reports view — separate section for the high-stakes work types so
// they don't get lost in the regular ECM queue. For each open dev/report
// item we surface:
//   • Days in limbo (since createdDate)
//   • Days since last update (modifiedAt)
//   • The last update — outcome details if present, else the current status
// Cards turn amber > 7 days stale, red > 14 days. Closed items still appear
// but at low opacity for context.
function _daysSince(iso){
  if (!iso) return -1;
  const t = Date.parse(iso);
  if (!t) return -1;
  return Math.floor((Date.now() - t) / 86400000);
}
// Status buckets for the Dev/Reports view. Open = active in-flight work;
// Parked = paused/blocked but not closed; Completed = done.
const DR_OPEN_STATUSES = new Set([
  'Verified on UAT', 'Verified on PRE', 'Ticket Sent',
  'Pending IR', 'Discussed with Dev', 'In Progress',
  'To-Do', 'Requested'
]);
const DR_PARKED_STATUSES = new Set([
  'On Hold', 'Waitlisted', 'Further discussion',
  'Not feasible - close ticket'
]);
// Status sort priority within the Open bucket — closer to done = higher rank
// (smaller number floats to the top). User's ordering: UAT > PRE > Ticket
// Sent > Pending IR > Discussed > In Progress > To-Do > Requested.
const DR_STATUS_RANK = {
  'Verified on UAT': 1,
  'Verified on PRE': 2,
  'Ticket Sent': 3,
  'Pending IR': 4,
  'Discussed with Dev': 5,
  'In Progress': 6,
  'To-Do': 7,
  'Requested': 8
};
function drStatusBucket(status){
  if (!status) return 'open'; // treat blank as open by default
  if (status === 'Completed') return 'completed';
  if (DR_PARKED_STATUSES.has(status)) return 'parked';
  return 'open';
}
function updateDevReportsCount(){
  const el = document.getElementById('devReportsCount');
  if (!el) return;
  // Tab badge = items in the Open bucket. Parked and Completed don't count
  // as "needs attention right now".
  const openDev = rows.filter(r => isDevOrReportRow(r) && drStatusBucket(r.status) === 'open').length;
  el.textContent = openDev > 0 ? String(openDev) : '';
}
// Dev/Reports view local filter state. Resets when you navigate away.
let _drTypeFilter = 'all';     // 'all' | 'dev' | 'report'
let _drStatusFilter = 'open';  // 'open' | 'parked' | 'completed' | 'all' | <specific status>
let _drProgramFilter = 'all';  // 'all' | <program name>
let _drAgeFilter = 'any';      // 'any' | '30' | '60' | '90' | '120'  (min days open)
let _drSortBy = 'status';      // 'status' | 'created'
function _wireDrFilters(root){
  const typeSel = root.querySelector('#drTypeSel');
  if (typeSel) typeSel.addEventListener('change', () => { _drTypeFilter = typeSel.value || 'all'; renderDevReports(); });
  const statusSel = root.querySelector('#drStatusSel');
  if (statusSel) statusSel.addEventListener('change', () => { _drStatusFilter = statusSel.value || 'open'; renderDevReports(); });
  const programSel = root.querySelector('#drProgramSel');
  if (programSel) programSel.addEventListener('change', () => { _drProgramFilter = programSel.value || 'all'; renderDevReports(); });
  const ageSel = root.querySelector('#drAgeSel');
  if (ageSel) ageSel.addEventListener('change', () => { _drAgeFilter = ageSel.value || 'any'; renderDevReports(); });
  const sortSel = root.querySelector('#drSortSel');
  if (sortSel) sortSel.addEventListener('change', () => { _drSortBy = sortSel.value || 'status'; renderDevReports(); });
  const resetBtn = root.querySelector('#drFilterReset');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    _drTypeFilter = 'all';
    _drStatusFilter = 'open';
    _drProgramFilter = 'all';
    _drAgeFilter = 'any';
    _drSortBy = 'status';
    renderDevReports();
  });
  root.querySelectorAll('[data-dr-open]').forEach(b => {
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = b.getAttribute('data-dr-open');
      if (!id) return;
      currentView = 'all';
      document.querySelectorAll('.view-tab').forEach(x => x.classList.toggle('active', x.dataset.view === 'all'));
      document.body.classList.remove('view-dev');
      document.body.classList.remove('view-notif');
      expandedId = id;
      render();
      setTimeout(() => {
        const row = document.querySelector(`.row[data-id="${id}"]`);
        if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 50);
    });
  });
}
function renderDevReports(){
  const list = document.getElementById('list');
  const metaEl = document.getElementById('metaCount');
  // INTENTIONALLY ignore the global owner filter — this view is a team-wide
  // queue. Apply local type / status / program filters instead.
  const all = rows.filter(isDevOrReportRow);
  let pool = all.slice();
  if (_drTypeFilter === 'dev') pool = pool.filter(r => devOrReportKind(r) === 'dev');
  else if (_drTypeFilter === 'report') pool = pool.filter(r => devOrReportKind(r) === 'report');
  // Status filter: bucket buckets ('open'/'parked'/'completed'), 'all' = no
  // filter, anything else = exact status match.
  if (_drStatusFilter === 'open') {
    pool = pool.filter(r => drStatusBucket(r.status) === 'open');
  } else if (_drStatusFilter === 'parked') {
    pool = pool.filter(r => drStatusBucket(r.status) === 'parked');
  } else if (_drStatusFilter === 'completed') {
    pool = pool.filter(r => drStatusBucket(r.status) === 'completed');
  } else if (_drStatusFilter !== 'all') {
    pool = pool.filter(r => r.status === _drStatusFilter);
  }
  if (_drProgramFilter !== 'all') pool = pool.filter(r => r.program === _drProgramFilter);
  if (_drAgeFilter !== 'any') {
    const minDays = parseInt(_drAgeFilter, 10) || 0;
    pool = pool.filter(r => _daysSince(r.createdDate) >= minDays);
  }
  if (filterSearch) {
    const q = filterSearch.toLowerCase();
    pool = pool.filter(r =>
      (r.task || '').toLowerCase().includes(q) ||
      String(r.ticket || '').toLowerCase().includes(q) ||
      (r.outcome || '').toLowerCase().includes(q) ||
      (r.details || '').toLowerCase().includes(q)
    );
  }
  // Status / age / program counts all reflect the CURRENT type filter, so
  // "Open (X)" actually means "open items of this type" instead of being
  // stuck at the global open count regardless of what you filtered by.
  // Type dropdown intentionally shows no counts (per user feedback — too
  // noisy when the other dropdowns already carry the numbers).
  const typeScoped = all.filter(r => {
    if (_drTypeFilter === 'dev') return devOrReportKind(r) === 'dev';
    if (_drTypeFilter === 'report') return devOrReportKind(r) === 'report';
    return true;
  });
  const programCounts = new Map();
  const statusCounts = new Map();
  let openCt = 0, parkedCt = 0, completedCt = 0;
  typeScoped.forEach(r => {
    if (r.program) programCounts.set(r.program, (programCounts.get(r.program) || 0) + 1);
    if (r.status) statusCounts.set(r.status, (statusCounts.get(r.status) || 0) + 1);
    const b = drStatusBucket(r.status);
    if (b === 'open') openCt++;
    else if (b === 'parked') parkedCt++;
    else if (b === 'completed') completedCt++;
  });
  const statusOptions = SS_STATUSES.filter(s => statusCounts.has(s)).map(s =>
    `<option value="${escHtml(s)}" ${_drStatusFilter === s ? 'selected' : ''}>${escHtml(s)} (${statusCounts.get(s)})</option>`
  ).join('');
  const programs = [...programCounts.entries()].sort((a, b) => b[1] - a[1]);
  const programOptions = programs.map(([name, ct]) =>
    `<option value="${escHtml(name)}" ${_drProgramFilter === name ? 'selected' : ''}>${escHtml(name)} (${ct})</option>`
  ).join('');
  // Age tallies — items in the OPEN bucket (of the current type scope)
  // that have been open at least N days.
  const openAll = typeScoped.filter(r => drStatusBucket(r.status) === 'open');
  const ageCounts = {
    30:  openAll.filter(r => _daysSince(r.createdDate) >= 30).length,
    60:  openAll.filter(r => _daysSince(r.createdDate) >= 60).length,
    90:  openAll.filter(r => _daysSince(r.createdDate) >= 90).length,
    120: openAll.filter(r => _daysSince(r.createdDate) >= 120).length
  };
  const typeCls = _drTypeFilter !== 'all' ? 'active' : '';
  const statusCls = _drStatusFilter !== 'open' ? 'active' : '';
  const programCls = _drProgramFilter !== 'all' ? 'active' : '';
  const ageCls = _drAgeFilter !== 'any' ? 'active' : '';
  const sortCls = _drSortBy !== 'status' ? 'active' : '';
  const anyFilterActive = _drTypeFilter !== 'all' || _drStatusFilter !== 'open' || _drProgramFilter !== 'all' || _drAgeFilter !== 'any' || _drSortBy !== 'status';
  const filtersHTML = `
    <div class="dr-filters">
      <select class="dr-filter-select ${typeCls}" id="drTypeSel">
        <option value="all" ${_drTypeFilter === 'all' ? 'selected' : ''}>All types</option>
        <option value="dev" ${_drTypeFilter === 'dev' ? 'selected' : ''}>Dev</option>
        <option value="report" ${_drTypeFilter === 'report' ? 'selected' : ''}>Reporting</option>
      </select>
      <select class="dr-filter-select ${statusCls}" id="drStatusSel">
        <option value="open" ${_drStatusFilter === 'open' ? 'selected' : ''}>Open (${openCt})</option>
        <option value="parked" ${_drStatusFilter === 'parked' ? 'selected' : ''}>Parked (${parkedCt})</option>
        <option value="completed" ${_drStatusFilter === 'completed' ? 'selected' : ''}>Completed (${completedCt})</option>
        <option value="all" ${_drStatusFilter === 'all' ? 'selected' : ''}>All (${typeScoped.length})</option>
        ${statusOptions}
      </select>
      <select class="dr-filter-select ${ageCls}" id="drAgeSel" title="Days open">
        <option value="any" ${_drAgeFilter === 'any' ? 'selected' : ''}>Any age</option>
        <option value="30" ${_drAgeFilter === '30' ? 'selected' : ''}>30+ days open (${ageCounts[30]})</option>
        <option value="60" ${_drAgeFilter === '60' ? 'selected' : ''}>60+ days open (${ageCounts[60]})</option>
        <option value="90" ${_drAgeFilter === '90' ? 'selected' : ''}>90+ days open (${ageCounts[90]})</option>
        <option value="120" ${_drAgeFilter === '120' ? 'selected' : ''}>120+ days open (${ageCounts[120]})</option>
      </select>
      <select class="dr-filter-select ${programCls}" id="drProgramSel">
        <option value="all" ${_drProgramFilter === 'all' ? 'selected' : ''}>All programs</option>
        ${programOptions}
      </select>
      <select class="dr-filter-select ${sortCls}" id="drSortSel" title="Sort">
        <option value="status" ${_drSortBy === 'status' ? 'selected' : ''}>Sort: Status</option>
        <option value="created" ${_drSortBy === 'created' ? 'selected' : ''}>Sort: Newest</option>
      </select>
      ${anyFilterActive ? `<button type="button" class="dr-filter-reset" id="drFilterReset">Reset</button>` : ''}
      <span class="dr-filter-meta">${pool.length} of ${all.length}</span>
    </div>`;
  // Group by status bucket so the layout matches the user's mental model:
  // Open work at the top (most actionable), Parked in the middle (paused),
  // Completed at the bottom (history).
  const buckets = { open: [], parked: [], completed: [] };
  pool.forEach(r => {
    const b = drStatusBucket(r.status);
    if (buckets[b]) buckets[b].push(r);
  });
  // Sort within each bucket.
  //   - Sort by Status (Open default): higher status rank = closer to done = top.
  //     Ties break by newest created.
  //   - Sort by Created: newest first across all statuses in the bucket.
  // Parked + Completed always sort by newest (status priority isn't
  // meaningful when items are paused/done).
  function sortByCreated(a, b){
    return (Date.parse(b.createdDate) || 0) - (Date.parse(a.createdDate) || 0);
  }
  function sortByStatusThenCreated(a, b){
    const ra = DR_STATUS_RANK[a.status] || 99;
    const rb = DR_STATUS_RANK[b.status] || 99;
    if (ra !== rb) return ra - rb;
    return sortByCreated(a, b);
  }
  const openSort = _drSortBy === 'created' ? sortByCreated : sortByStatusThenCreated;
  buckets.open.sort(openSort);
  buckets.parked.sort(sortByCreated);
  buckets.completed.sort(sortByCreated);
  if (metaEl) metaEl.textContent = `${all.length} dev / report item${all.length === 1 ? '' : 's'}`;
  if (!pool.length) {
    list.innerHTML = filtersHTML + `<div class="empty">${all.length === 0 ? 'No dev or report items found. Make sure the <strong>Request Type</strong> column has Dev / Reporting values set in Smartsheets.' : 'No items match the current filters.'}</div>`;
    _wireDrFilters(list);
    return;
  }
  function cardHTML(r){
    const isClosed = r.status === 'Completed' || r.status === 'Not feasible - close ticket';
    const ageDays = _daysSince(r.createdDate);
    let cardCls = 'dr-card';
    // Stale based on limbo time only — modifiedAt is unreliable because the
    // sync layer touches rows during regular operation, so "days since last
    // update" doesn't actually reflect human activity. Drop it from the UI.
    if (isClosed) cardCls += ' closed';
    else if (ageDays >= 30) cardCls += ' very-stale';
    else if (ageDays >= 14) cardCls += ' stale';
    const kind = devOrReportKind(r);
    const typeLbl = (r.requestType || (kind === 'report' ? 'Reporting' : 'Dev')).toString();
    const sCls = statusClass(r.status);
    const statusHTML = r.status
      ? `<span class="row-status ${sCls}">${escHtml(r.status)}</span>`
      : `<span class="row-status">No status</span>`;
    const ticketHTML = r.ticket
      ? `<span class="row-ticket">#${escHtml(String(r.ticket).replace(/\.0$/, ''))}</span>`
      : '';
    const programHTML = r.program
      ? (() => { const pc = programColor(r.program); return `<span class="row-program" style="background:${pc.bg};border-color:${pc.bd};color:${pc.fg}">${escHtml(r.program)}</span>`; })()
      : '';
    // "Days open" = days since createdDate. For Parked items it's still
    // accurate (parked items haven't closed). For Completed, we hide it
    // since "X days open" doesn't make sense on a closed item.
    const limboCls = ageDays >= 30 ? 'very-stale' : ageDays >= 14 ? 'stale' : '';
    const limboHTML = (ageDays >= 0 && !isClosed)
      ? `<span class="dr-limbo ${limboCls}" title="Days since this row was created">${ageDays}d open</span>`
      : '';
    // Only render the notes block if there's actual content. Empty
    // placeholders just waste vertical space across a dense grid.
    const notesHTML = (r.outcome && r.outcome.trim())
      ? `<div class="dr-notes">${escHtml(r.outcome.trim())}</div>`
      : '';
    const openInSheetHTML = r.permalink
      ? `<a href="${escHtml(r.permalink)}" target="_blank" rel="noopener" title="Open in Smartsheets">Smartsheets ↗</a>`
      : '';
    return `
      <div class="${cardCls}" data-id="${escHtml(String(r.id))}">
        <div class="dr-head">
          <span class="dr-type ${kind}">${escHtml(typeLbl)}</span>
          ${statusHTML}
          ${ticketHTML}
          ${programHTML}
        </div>
        <div class="dr-task">${escHtml(r.task || '(untitled)')}</div>
        ${notesHTML}
        <div class="dr-foot">
          ${limboHTML}
          <span class="dr-owner">${escHtml(r.owner || '—')}</span>
          <div class="dr-actions">
            <button type="button" data-dr-open="${escHtml(String(r.id))}">Drawer</button>
            ${openInSheetHTML}
          </div>
        </div>
      </div>`;
  }
  const sectionHeadHTML = (title, count) =>
    `<div class="dr-section-head"><h3>${escHtml(title)}</h3><span class="ct">${count}</span></div>`;
  const html = [filtersHTML, '<div class="dr-list">'];
  if (buckets.open.length) {
    html.push(sectionHeadHTML('Open', buckets.open.length));
    buckets.open.forEach(r => html.push(cardHTML(r)));
  }
  if (buckets.parked.length) {
    html.push(sectionHeadHTML('Parked', buckets.parked.length));
    buckets.parked.forEach(r => html.push(cardHTML(r)));
  }
  if (buckets.completed.length) {
    html.push(sectionHeadHTML('Completed', buckets.completed.length));
    buckets.completed.forEach(r => html.push(cardHTML(r)));
  }
  html.push('</div>');
  list.innerHTML = html.join('');
  _wireDrFilters(list);
}

// Notifications list — shows notifications addressed to the current user. Tap
// a row to ack it (mirrors the row's ack on the main list too, since ack
// semantics are the same — "I saw this"). Unacked notifications are highlighted.
function renderNotifications(){
  const list = document.getElementById('list');
  const metaEl = document.getElementById('metaCount');
  if (!_userName) {
    if (metaEl) metaEl.textContent = '';
    list.innerHTML = `<div class="empty">Set your name (top right) to see notifications targeted to you.</div>`;
    return;
  }
  // Unified inbox model: every row currently assigned to me (that I haven't
  // acked yet) shows up as a notification. We enrich each item with metadata
  // from the ecm_notifications collection when available so we can say
  // "Reassigned from Talha" instead of just "New task." The ack/unack
  // mechanism on the row IS the read/unread state — no separate notif ack.
  //
  // Excludes dev/report items — those live on the Dev/Reports tab.
  const myRows = rows.filter(r =>
    r.owner === _userName &&
    !isDevOrReportRow(r) &&
    r.status !== 'Completed' &&
    r.status !== 'Not feasible - close ticket'
  );
  // Index latest notification doc per row id for context decoration.
  const notifByRow = new Map();
  notifications.forEach(n => {
    if (n.targetUser !== _userName) return;
    const cur = notifByRow.get(n.rowId);
    if (!cur || (Date.parse(n.createdAt) || 0) > (Date.parse(cur.createdAt) || 0)) {
      notifByRow.set(n.rowId, n);
    }
  });
  // Merge: build a list of { row, notif } entries. Sort by notif createdAt
  // (most recent first), falling back to row's createdDate.
  const merged = myRows.map(r => ({ row: r, notif: notifByRow.get(String(r.id)) || null }));
  merged.sort((a, b) => {
    const ta = (a.notif && Date.parse(a.notif.createdAt)) || Date.parse(a.row.createdDate) || 0;
    const tb = (b.notif && Date.parse(b.notif.createdAt)) || Date.parse(b.row.createdDate) || 0;
    return tb - ta;
  });
  const unread = merged.filter(m => !acks[m.row.id]);
  const archived = merged.filter(m => !!acks[m.row.id]);
  // Default = unread only. Toggle to see what you've already cleared.
  const visible = _showArchivedNotifs ? archived : unread;
  if (metaEl) metaEl.textContent = unread.length > 0
    ? `${unread.length} unread · ${archived.length} archived`
    : (archived.length > 0 ? `0 unread · ${archived.length} archived` : 'No notifications');
  // Header row: toggle between Inbox (unread) and Archive
  const toggleHTML = `
    <div class="notif-toggle-row">
      <button type="button" class="notif-toggle-btn ${!_showArchivedNotifs ? 'active' : ''}" data-notif-tab="inbox">
        Inbox <span class="ct">${unread.length}</span>
      </button>
      <button type="button" class="notif-toggle-btn ${_showArchivedNotifs ? 'active' : ''}" data-notif-tab="archive">
        Archive <span class="ct">${archived.length}</span>
      </button>
    </div>`;
  if (!visible.length) {
    const emptyMsg = _showArchivedNotifs
      ? 'No archived notifications yet. Items you mark as read land here.'
      : (merged.length === 0
          ? `No open items assigned to <strong>${escHtml(_userName)}</strong>.`
          : 'Inbox is clear. Tap Archive above to see what you\'ve already read.');
    list.innerHTML = toggleHTML + `<div class="empty">${emptyMsg}</div>`;
    _wireNotifToggle(list);
    return;
  }
  list.innerHTML = toggleHTML + visible.map(m => {
    const r = m.row;
    const n = m.notif;
    const isAcked = !!acks[r.id];
    const ack = acks[r.id];
    // Reason label: explicit notif kind (new/reassign) when we have one,
    // otherwise just show the current status as context.
    let kindLabel, kindCls;
    if (n && n.kind === 'reassign') { kindLabel = 'Reassigned to you'; kindCls = 'reassign'; }
    else if (n && n.kind === 'new') { kindLabel = 'New task'; kindCls = 'new'; }
    else { kindLabel = r.status || 'Assigned to you'; kindCls = 'new'; }
    const when = (n && (timeAgo(n.createdAt) || fmtAbsoluteDate(n.createdAt)))
      || timeAgo(r.createdDate)
      || fmtAbsoluteDate(r.createdDate)
      || '';
    const ticketBit = r.ticket
      ? `<span><span class="label">Ticket</span><span class="val">#${escHtml(String(r.ticket).replace(/\.0$/, ''))}</span></span>`
      : '';
    const programBit = r.program
      ? `<span><span class="label">Program</span><span class="val">${escHtml(r.program)}</span></span>`
      : '';
    const prevBit = (n && n.kind === 'reassign' && n.previousOwner)
      ? `<span><span class="label">From</span><span class="val">${escHtml(n.previousOwner)}</span></span>`
      : '';
    const ackBadge = isAcked
      ? `<span class="notif-ack-state">✓ Read${ack && ack.ackedAt ? ' · ' + escHtml(timeAgo(ack.ackedAt) || '') : ''}</span>`
      : '';
    const permaBtn = r.permalink
      ? `<button type="button" data-notif-open="${escHtml(r.permalink)}">Open in Smartsheets</button>`
      : '';
    const ackBtn = isAcked
      ? `<button type="button" data-notif-unack-row="${escHtml(String(r.id))}">Mark unread</button>`
      : `<button type="button" class="primary" data-notif-ack-row="${escHtml(String(r.id))}">Mark as read</button>`;
    return `
      <div class="notif-row ${isAcked ? '' : 'unread'}">
        <div class="notif-head">
          <span class="notif-kind ${kindCls}">${escHtml(kindLabel)}</span>
          <span class="notif-when">${escHtml(when)}</span>
          ${ackBadge}
        </div>
        <div class="notif-task">${escHtml(r.task || '(untitled)')}</div>
        <div class="notif-meta">
          ${prevBit}
          ${ticketBit}
          ${programBit}
        </div>
        <div class="notif-actions">
          ${ackBtn}
          ${permaBtn}
        </div>
      </div>`;
  }).join('');
  // Wire actions — read/unread maps directly to the row's ack record now.
  list.querySelectorAll('[data-notif-ack-row]').forEach(b => {
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = b.getAttribute('data-notif-ack-row');
      if (id) ackRow(id, _userName, '').catch(err => console.warn('ack failed', err));
    });
  });
  list.querySelectorAll('[data-notif-unack-row]').forEach(b => {
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = b.getAttribute('data-notif-unack-row');
      if (id) unackRow(id).catch(err => console.warn('unack failed', err));
    });
  });
  list.querySelectorAll('[data-notif-open]').forEach(b => {
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      const url = b.getAttribute('data-notif-open') || '';
      if (url) window.open(url, '_blank', 'noopener');
    });
  });
  _wireNotifToggle(list);
}
function _wireNotifToggle(root){
  root.querySelectorAll('[data-notif-tab]').forEach(b => {
    b.addEventListener('click', () => {
      _showArchivedNotifs = (b.getAttribute('data-notif-tab') === 'archive');
      renderNotifications();
    });
  });
}

// Push the Internal Only checkbox value back to Smartsheets. Separate from
// pushField because checkbox columns need a true/false value (not a string)
// and we want to silently no-op if the column doesn't exist on the sheet.
async function pushInternalToSheet(r, isInternal){
  const col = columns['Internal Only'];
  if (!col) return; // sheet doesn't have the column — skip silently
  const c = getConfig();
  if (!c.sheetId) return;
  const body = [{ id: r.id, cells: [{ columnId: col.id, value: !!isInternal, strict: false }] }];
  const res = await ssProxy(`/sheets/${c.sheetId}/rows`, 'PUT', body);
  if (!res.ok) {
    const t = await res.text().catch(() => '');
    throw new Error(`Smartsheets ${res.status}: ${t.slice(0, 200)}`);
  }
}
async function pushField(r, fieldTitle, value, rowEl){
  const col = columns[fieldTitle];
  if (!col) return;
  const c = getConfig();
  if (!c.token) return;
  const savedEl = rowEl.querySelector('[data-saved]');
  if (savedEl) { savedEl.textContent = 'Saving…'; savedEl.classList.remove('ok','err'); }
  // Smartsheets accepts null to clear, otherwise the typed value
  const cells = [{ columnId: col.id, value: value === '' ? null : value, strict: false }];
  // Status change → also update Completion Date sensibly
  if (fieldTitle === 'Status') {
    const colCompletion = columns['Completion Date'];
    if (colCompletion) {
      if (value === 'Completed') {
        const today = new Date().toISOString().slice(0, 10);
        cells.push({ columnId: colCompletion.id, value: today, strict: false });
      } else {
        cells.push({ columnId: colCompletion.id, value: null, strict: false });
      }
    }
  }
  const body = [{ id: r.id, cells }];
  try {
    const res = await ssProxy(`/sheets/${c.sheetId}/rows`, 'PUT', body);
    if (!res.ok) {
      const t = await res.text().catch(() => '');
      throw new Error(`${res.status}: ${t.slice(0, 200)}`);
    }
    // Mirror local
    if (fieldTitle === 'Status') r.status = value;
    if (fieldTitle === 'Ticket #') r.ticket = value;
    if (fieldTitle === 'Details') r.details = value;
    if (fieldTitle === 'Outcome Details') r.outcome = value;
    if (fieldTitle === 'Task Name') r.task = value;
    if (fieldTitle === 'Owner') r.owner = value;
    if (fieldTitle === 'Completion Date') r.completionDate = value;
    if (savedEl) {
      savedEl.textContent = 'Saved to Smartsheets';
      savedEl.classList.add('ok');
      setTimeout(() => { if (savedEl) { savedEl.textContent = ''; savedEl.classList.remove('ok'); } }, 2000);
    }
    // Re-render the parent row badges if the status changed
    if (fieldTitle === 'Status') render();
    // Re-render so the green completion-date pill (or MISSING marker) on the
    // row reflects the new value
    if (fieldTitle === 'Completion Date') render();
  } catch (e) {
    console.error('push failed', e);
    if (savedEl) {
      savedEl.textContent = 'Save failed — try again';
      savedEl.classList.add('err');
    }
  }
}

// Wire top-level controls
document.getElementById('btnSync').addEventListener('click', loadSheet);
document.getElementById('searchInput').addEventListener('input', (e) => {
  filterSearch = e.target.value || '';
  render();
});
// Mobile Filters toggle — show/hide the secondary filter dropdowns inline
const mobileFiltersBtn = document.getElementById('mobileFiltersBtn');
if (mobileFiltersBtn) {
  mobileFiltersBtn.addEventListener('click', () => {
    const topbar = document.querySelector('.topbar');
    if (!topbar) return;
    const isOpen = topbar.classList.toggle('show-mobile-filters');
    mobileFiltersBtn.classList.toggle('active', isOpen);
  });
}
document.getElementById('ownerSelect').addEventListener('change', (e) => {
  filterOwner = e.target.value || '';
  render();
});
document.getElementById('programSelect').addEventListener('change', (e) => {
  filterProgram = e.target.value || '';
  render();
});
// Sort controls
const sortSel = document.getElementById('sortSelect');
const sortDirBtn = document.getElementById('sortDirBtn');
function syncSortUI(){
  if (sortSel) sortSel.value = sortBy;
  if (sortDirBtn) {
    sortDirBtn.classList.toggle('desc', sortDir === 'desc');
    sortDirBtn.title = sortDir === 'desc' ? 'Descending — tap for ascending' : 'Ascending — tap for descending';
  }
}
syncSortUI();
if (sortSel) sortSel.addEventListener('change', (e) => {
  sortBy = e.target.value || 'name';
  try { localStorage.setItem('ecm-sort-by', sortBy); } catch {}
  syncSortUI();
  render();
});
if (sortDirBtn) sortDirBtn.addEventListener('click', () => {
  sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  try { localStorage.setItem('ecm-sort-dir', sortDir); } catch {}
  syncSortUI();
  render();
});

// Default to "Open" filter on first land — matches the daily mental model
filterStatus = '__open__';

// View toggle wiring (All rows / Acks)
document.querySelectorAll('.view-tab').forEach(b => {
  b.addEventListener('click', () => {
    const v = b.dataset.view;
    if (v === currentView) return;
    currentView = v;
    document.querySelectorAll('.view-tab').forEach(x => x.classList.toggle('active', x === b));
    document.body.classList.toggle('view-ack', currentView === 'ack');
    document.body.classList.toggle('view-dev', currentView === 'dev');
    document.body.classList.toggle('view-notif', currentView === 'notif');
    if (currentView !== 'ack') {
      selectedAckIds.clear();
      renderBulkBar();
    }
    render();
  });
});

// User identity pill — opens the name picker dropdown
const userPillEl = document.getElementById('userPill');
if (userPillEl) {
  userPillEl.addEventListener('click', () => {
    openNamePicker({
      title: _userName ? 'Change name' : 'Who are you?',
      sub: 'Pick from the team or type a new name.'
    });
  });
}
updateUserPill();

// Wire the name-picker modal close + save + click-outside-to-close
(function wireNamePicker(){
  const bd = document.getElementById('namePickerBackdrop');
  const closeBtn = document.getElementById('namePickerClose');
  const saveBtn = document.getElementById('namePickerSave');
  const writeIn = document.getElementById('namePickerWrite');
  if (closeBtn) closeBtn.addEventListener('click', closeNamePicker);
  if (saveBtn) saveBtn.addEventListener('click', saveNamePicker);
  if (writeIn) writeIn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); saveNamePicker(); }
  });
  if (bd) bd.addEventListener('click', (e) => { if (e.target === bd) closeNamePicker(); });
})();

// Bulk action bar wiring
const bulkAckBtn = document.getElementById('bulkAckBtn');
const bulkClearBtn = document.getElementById('bulkClearBtn');
if (bulkAckBtn) bulkAckBtn.addEventListener('click', bulkAck);
if (bulkClearBtn) bulkClearBtn.addEventListener('click', () => {
  selectedAckIds.clear();
  renderBulkBar();
  render();
});

// Subscribe to acks live — Firestore snapshot keeps multiple team members'
// views in sync as they ack tasks.
subscribeAcks();
subscribeInternal();
subscribeNotifications();

// Bell icon → jump straight to notifications tab.
const bellBtnEl = document.getElementById('bellBtn');
if (bellBtnEl) {
  bellBtnEl.addEventListener('click', () => {
    if (currentView === 'notif') return;
    currentView = 'notif';
    document.querySelectorAll('.view-tab').forEach(x => {
      x.classList.toggle('active', x.dataset.view === 'notif');
    });
    document.body.classList.remove('view-ack');
    document.body.classList.remove('view-dev');
    document.body.classList.add('view-notif');
    selectedAckIds.clear();
    renderBulkBar();
    render();
  });
}

// Listen for settings changes from shell (e.g., user just configured token)
window.addEventListener('message', (ev) => {
  if (ev && ev.data && ev.data.type === 'warroom:smartsheets-config-changed') loadSheet();
});

// Boot: load the sheet, then prompt for identity if we're in team mode and
// don't know who's looking yet. Picking a name auto-filters to their tasks.
loadSheet().then(() => {
  if (_teamMode && !_userName) {
    setTimeout(() => {
      try {
        openNamePicker({
          title: 'Who are you?',
          sub: 'We\'ll show your tasks first. You can change this any time from the top-right pill.'
        });
      } catch {}
    }, 300);
  }
});
</script>
</body>
</html>
