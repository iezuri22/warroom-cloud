<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Eat Well — War Room</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="/sync-client.js"></script>
<style>
  :root{
    color-scheme:light;
    --bg:#F3F4F6;--bg-elev:#FFFFFF;--bg-glass:rgba(243,244,246,.92);
    --ink:#111318;
    --w04:rgba(17,19,24,.06);--w06:rgba(17,19,24,.08);--w10:rgba(17,19,24,.14);
    --w30:rgba(17,19,24,.46);--w45:rgba(17,19,24,.62);--w70:rgba(17,19,24,.80);
    --blue:#2563EB;--green:#15803D;--green-tint:rgba(21,128,61,.12);--green-bd:rgba(21,128,61,.28);
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;font-feature-settings:'cv05','tnum' 0;-webkit-font-smoothing:antialiased;}
  body{max-width:600px;margin:0 auto;min-height:100vh;padding:0 18px calc(40px + env(safe-area-inset-bottom));}
  .topbar{position:sticky;top:0;z-index:30;background:var(--bg-glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--w06);padding:max(14px,env(safe-area-inset-top)) 0 12px;margin:0 -18px 0;padding-left:18px;padding-right:18px;}
  .crumb{font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--w45);text-decoration:none;text-transform:uppercase;display:block;margin-bottom:2px;}
  .crumb:active{color:var(--ink);}
  .title{font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1;background:linear-gradient(135deg,var(--ink),var(--w70));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}

  .section-l{font-size:11px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:var(--w45);margin:22px 2px 10px;}
  .feat{background:var(--bg-elev);border:1px solid var(--green-bd);border-radius:var(--radius);padding:18px;box-shadow:0 1px 3px rgba(17,19,24,.05);}
  .feat .eyebrow{font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--green);}
  .feat h2{font-size:21px;font-weight:900;letter-spacing:-.02em;line-height:1.15;margin:5px 0 9px;}
  .feat p{font-size:15px;line-height:1.55;color:var(--w70);font-weight:500;}
  .cat{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--green);background:var(--green-tint);border:1px solid var(--green-bd);padding:3px 9px;border-radius:6px;margin-top:12px;}

  .post{background:var(--bg-elev);border:1px solid var(--w06);border-radius:14px;padding:15px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(17,19,24,.04);cursor:pointer;}
  .post .ph{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .post h3{font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.25;}
  .post .chev{flex:0 0 auto;color:var(--w30);font-size:14px;transition:transform .18s;margin-top:3px;}
  .post.open .chev{transform:rotate(90deg);}
  .post .meta{font-size:11px;font-weight:700;color:var(--w45);text-transform:uppercase;letter-spacing:.4px;margin-top:5px;}
  .post .b{font-size:14.5px;line-height:1.55;color:var(--w70);font-weight:500;max-height:0;overflow:hidden;transition:max-height .25s ease,margin .25s ease;}
  .post.open .b{max-height:400px;margin-top:11px;}

  .foot{text-align:center;color:var(--w30);font-size:12px;margin-top:26px;line-height:1.5;}
  @media(min-width:760px){body{max-width:760px;}}
</style>
</head>
<body>
<div class="topbar">
  <a class="crumb" href="/food-journal.html">&#8249; Journal</a>
  <div class="title">Eat Well</div>
</div>

<div class="section-l">This week</div>
<div id="featured"></div>

<div class="section-l">All tips</div>
<div id="posts"></div>

<div class="foot">Gut-health and healthy-eating tips.<br>A new one is featured each week.</div>

<script>
const POSTS=[
  {cat:"Gut health",title:"Chase 30 plants a week, not just more veg",body:"The single best-supported move for a healthy gut is variety. People who eat 30+ different plant types a week have noticeably more diverse microbiomes than those eating 10 or fewer. Plants count broadly: vegetables, fruit, whole grains, beans, nuts, seeds, herbs, and spices. Keep a loose tally through the week and aim to hit new ones."},
  {cat:"Gut health",title:"Eat something fermented most days",body:"Fermented foods feed your gut live microbes and have been linked to greater microbiome diversity and lower inflammation. Rotate through yogurt, kefir, kimchi, sauerkraut, miso, and tempeh. A few spoonfuls with a meal is enough; consistency beats quantity."},
  {cat:"Nutrition",title:"Aim for about 30g of fiber a day",body:"Most adults get half of what they need. Fiber is the main fuel for the bacteria that keep your gut lining strong. Lean on beans, lentils, oats, berries, chia, and whole grains. Ramp up gradually and drink more water, or you'll bloat while your gut adjusts."},
  {cat:"Habits",title:"Front-load protein at breakfast",body:"Getting 25 to 30g of protein early (eggs, Greek yogurt, cottage cheese, a good shake) steadies blood sugar and blunts the mid-afternoon crash that drives fast-food decisions. A protein-poor breakfast is often the real reason dinner goes sideways."},
  {cat:"Gut health",title:"Beets are a quiet powerhouse",body:"Your friend's nightly beets are onto something. Beets bring fiber, nitrates that support blood flow, and betalains that help with inflammation. Roast a batch on Sunday and add them to salads, eggs, or grain bowls all week so it's effortless."},
  {cat:"Nutrition",title:"Don't fear resistant starch",body:"Cook potatoes, rice, or oats, then cool them, and some of the starch becomes resistant starch that your good bacteria turn into butyrate, a compound that feeds your gut lining. Cooled potato salad, overnight oats, and leftover rice all qualify. Slightly green bananas count too."},
  {cat:"Habits",title:"Slow down and actually chew",body:"Digestion starts in your mouth, and eating fast is a top cause of bloating and overeating. Put the fork down between bites and give your body the ~20 minutes it needs to register fullness. It's the cheapest gut upgrade there is."},
  {cat:"Habits",title:"Give your gut an overnight rest",body:"A 12-hour overnight gap between dinner and breakfast gives your digestive system a repair window and tends to curb late-night grazing. You don't need extreme fasting; just stop eating a couple hours before bed and let the clock do the work."},
  {cat:"Nutrition",title:"Hydration is a gut tool",body:"Water keeps fiber moving and prevents the constipation that derails everything else. Aim for pale-yellow urine as your gauge. Coffee and tea count toward fluids, but don't let caffeine stand in for an actual meal."},
  {cat:"Gut health",title:"Pair prebiotics with probiotics",body:"Prebiotic foods (garlic, onions, leeks, asparagus, slightly green bananas, oats) are the fertilizer; fermented foods are the seeds. Eat them together, like yogurt with oats and banana, and you feed the good bacteria while adding more of them."},
  {cat:"Nutrition",title:"Keep ultra-processed food occasional, not routine",body:"Fast food and heavily processed snacks tend to be low in fiber and high in additives that can thin the gut lining and starve good bacteria. The goal isn't never; it's making it a clear exception rather than the default. Three-plus fast-food meals in a week is the line worth watching."},
  {cat:"Habits",title:"Eat the rainbow on purpose",body:"Different plant colors carry different polyphenols, and different polyphenols feed different microbes. Build a plate that has more than one color: leafy greens, berries, beets, orange squash, purple cabbage. Color variety is an easy proxy for nutrient variety."}
];

function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);
  const ys=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil((((t-ys)/86400000)+1)/7);
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  const wk=isoWeek(new Date());
  const fi=wk%POSTS.length;
  const f=POSTS[fi];
  document.getElementById("featured").innerHTML=
    '<div class="feat"><div class="eyebrow">Tip of the week</div><h2>'+esc(f.title)+'</h2><p>'+esc(f.body)+'</p><span class="cat">'+esc(f.cat)+'</span></div>';
  const rest=POSTS.map((p,i)=>({p,i})).filter(x=>x.i!==fi);
  document.getElementById("posts").innerHTML=rest.map(({p},idx)=>
    '<div class="post" onclick="this.classList.toggle(\'open\')">'+
      '<div class="ph"><h3>'+esc(p.title)+'</h3><span class="chev">&#9656;</span></div>'+
      '<div class="meta">'+esc(p.cat)+'</div>'+
      '<div class="b">'+esc(p.body)+'</div>'+
    '</div>'
  ).join("");
}
render();
</script>
</body>
</html>
