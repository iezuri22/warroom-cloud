<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F1">
<title>Life log — War Room</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/sync-client.js"></script>
<!--
  Life log — the things you did and need to remember: an oil change and when
  the next one is due, a battery and how long its warranty runs, a dentist
  cleaning, a registration renewal.

  Data (Firestore project tv-todos, same as the rest of War Room):
    life_records/{id}  one doc per thing you logged. `key` is the normalized
                       title, and entries sharing it are one series: the newest
                       one is "current" and owns the reminders.
    life_photos/{id}   a receipt or photo as a base64 JPEG (downscaled to stay
                       under the 1 MB doc cap — Firebase Storage needs the paid
                       plan on this project, see hair-recovery.html).
  Reminders are ordinary Personal tasks in tv_todos, shaped like the Notes
  task sheet's "By deadline" tasks (planned + plannedFor + deadline), so
  Personal lists them under Planned and lifts them to the top of Today on the
  day (autoPromotePlannedDue). Ids are deterministic —
  life_<entry>_<due|wty>_<deadline> — so saving twice can never make two, and
  a new deadline is a new task rather than a moved one (a task already on
  Today can't be pulled back off Personal's list from here).
  Reminder tasks are only ever written from a user action here (save, delete,
  dismiss, "Set it"); a page load never writes.
-->
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:light;
  --bg:#F6F5F1;
  --surface:#FFFFFF;
  --fill:rgba(33,30,25,.05);
  --fill-2:rgba(33,30,25,.09);
  --border:rgba(33,30,25,.08);
  --border-strong:rgba(33,30,25,.16);
  --ink:#211E19;
  --ink-mid:rgba(33,30,25,.58);
  --ink-dim:rgba(33,30,25,.38);
  --accent:#F07E28;
  --accent-soft:rgba(240,126,40,.13);
  --accent-ink:#B35A14;
  --on-accent:#FFF7EF;
  --green:#1E9E6A; --green-soft:rgba(30,158,106,.12);
  --red:#DC4B3E; --red-soft:rgba(220,75,62,.11);
  --blue:#3B6FD4; --blue-soft:rgba(59,111,212,.11);
  --purple:#7C63E8; --teal:#2AA79B; --amber:#E8A23D; --coral:#E96A5B;
  --radius:16px; --radius-sm:11px;
  --shadow-card:0 1px 3px rgba(33,30,25,.08);
  --shadow-float:0 10px 28px rgba(33,30,25,.18);
  --font:'Inter',-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
body{min-height:100vh;padding:22px 24px 72px}
body.embed{padding-top:14px}
body.sheet-open{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
[hidden]{display:none !important}
svg{display:block;flex-shrink:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.page{max-width:1180px;margin:0 auto}

/* ---- header ---- */
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.top .ttl{flex:1;min-width:0}
h1{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.sub{margin-top:3px;font-size:13.5px;color:var(--ink-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub .late{color:var(--red);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 15px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;transition:background .15s,filter .15s,opacity .15s}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--fill)}
.btn.ghost:hover{background:var(--fill-2)}
.btn.danger{color:var(--red);padding:0 10px}
.btn.danger.arm{background:var(--red);color:#fff;padding:0 14px}
.btn:disabled{opacity:.45;cursor:default;filter:none}

/* ---- toolbar (only once there's enough to filter) ---- */
.tools{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.search{flex:0 1 300px;min-width:0;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-card);color:var(--ink-dim)}
.search svg{width:15px;height:15px}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14px;color:var(--ink)}
.search input::placeholder{color:var(--ink-dim)}
.chips{display:flex;gap:6px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-card);font-size:13px;font-weight:600;color:var(--ink-mid)}
.chip svg{width:14px;height:14px;color:var(--c,currentColor)}
.chip .n{font-weight:600;color:var(--ink-dim);font-size:12px}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.chip.on svg,.chip.on .n{color:rgba(255,255,255,.7)}

/* ---- layout: two columns on desktop, one stack on phones ---- */
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:900px){ .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:28px} }
.col{display:flex;flex-direction:column;gap:24px;min-width:0}
.sec-h{display:flex;align-items:baseline;gap:8px;padding:0 4px 9px}
.sec-h h2{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-mid)}
.sec-h .n{font-size:12px;font-weight:600;color:var(--ink-dim)}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-card);overflow:hidden}
.yr{display:flex;justify-content:space-between;align-items:baseline;padding:14px 6px 7px;font-size:12.5px;font-weight:700;color:var(--ink-dim)}
.yr:first-child{padding-top:0}
.yr span:last-child{font-weight:600}

/* a row: icon · text · status */
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:62px;cursor:pointer;position:relative;outline-offset:-2px}
.row + .row{border-top:1px solid var(--border)}
@media (hover:hover){ .row:hover{background:rgba(33,30,25,.022)} }
.ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--c-soft);color:var(--c)}
.ic svg{width:19px;height:19px}
.mn{flex:1;min-width:0}
.t{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;line-height:1.3}
.t .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t svg{width:13px;height:13px}
.t .bell{color:var(--blue)}
.t .warn{color:var(--red)}
.s{font-size:12.5px;color:var(--ink-mid);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;text-align:right}
.date{font-size:13px;font-weight:600;color:var(--ink-mid);white-space:nowrap}
.glyphs{display:flex;gap:5px;color:var(--ink-dim)}
.glyphs svg{width:13px;height:13px}
.glyphs .g-ok{color:var(--green)}
.pill{display:inline-flex;align-items:center;gap:4px;height:23px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--fill);color:var(--ink-mid)}
.pill svg{width:12px;height:12px}
.pill.soon{background:var(--accent-soft);color:var(--accent-ink)}
.pill.late{background:var(--red-soft);color:var(--red)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--fill);color:var(--ink)}
.mini svg{width:13px;height:13px}
.mini.go{background:var(--ink);color:#fff}
@media (hover:hover){ .mini:hover{background:var(--fill-2)} .mini.go:hover{background:#000} }
.bar{height:3px;border-radius:2px;background:var(--fill-2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--green)}
.bar.soon i{background:var(--accent)}
.bar.end i{background:var(--ink-dim)}

.empty{padding:16px 16px 17px;font-size:13.5px;color:var(--ink-mid);line-height:1.5}
.empty b{color:var(--ink);font-weight:600}

/* first run: nothing logged yet */
.hero{padding:30px 24px 26px;text-align:center}
.hero .hi{width:52px;height:52px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.hero .hi svg{width:26px;height:26px}
.hero h2{font-size:19px;font-weight:700;letter-spacing:-.02em}
.hero p{margin:6px auto 0;max-width:430px;font-size:14px;line-height:1.5;color:var(--ink-mid)}
.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
.quick .chip svg{color:var(--c)}

/* loading */
.sk{height:62px;border-top:1px solid var(--border);background:linear-gradient(90deg,transparent,rgba(33,30,25,.035),transparent) 0 0/200% 100%;animation:sk 1.2s linear infinite}
.sk:first-child{border-top:0}
@keyframes sk{to{background-position:-200% 0}}
.banner{display:flex;align-items:center;gap:8px;margin-bottom:16px;padding:10px 14px;border-radius:12px;background:var(--red-soft);color:var(--red);font-size:13px;font-weight:500}
.banner svg{width:15px;height:15px}

.foot{margin-top:34px;text-align:center;font-size:11px;color:var(--ink-dim)}

/* ---- sheet (the form and the detail view) ---- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(33,30,25,.3);animation:fade .15s ease-out}
.sheet{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:min(88vh,880px);display:flex;flex-direction:column;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-float);overflow:hidden;animation:pop .18s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh-head{display:flex;align-items:center;gap:12px;padding:16px 14px 14px 20px;border-bottom:1px solid var(--border)}
.sh-head .hd{flex:1;min-width:0}
.sh-head h3{font-size:17px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-head .hs{font-size:12.5px;color:var(--ink-mid);margin-top:2px}
.x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink-mid);flex-shrink:0}
.x svg{width:16px;height:16px}
.sh-body{flex:1;overflow:auto;padding:4px 20px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-foot{display:flex;gap:8px;align-items:center;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.grow{flex:1}
@media (max-width:640px){
  body{padding:16px 16px 64px}
  body.embed{padding-top:12px}
  h1{font-size:23px}
  .sheet{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:94vh;max-height:94dvh;border-radius:20px 20px 0 0;animation:up .22s cubic-bezier(.2,.8,.2,1)}
  .tools{flex-wrap:wrap}
  .search{flex:1 1 100%}
  .chips{flex:1 1 100%}
  .chips .chip{flex:1 1 auto;justify-content:center;padding:0 10px}
  .chip .chip-l{white-space:nowrap}
  .sub{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  /* Four or more categories: icons carry them, so no label is ever cut. */
  .chips.many .chip:not([data-v="all"]) .chip-l{display:none}
}

/* form */
.f{padding:14px 0;border-bottom:1px solid var(--border)}
.f:last-child{border-bottom:0}
.lbl{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink-mid);margin-bottom:7px}
.lbl svg{width:13px;height:13px}
.lbl.lead{margin:12px 0 6px}
.in{width:100%;height:40px;padding:0 12px;border-radius:10px;border:1px solid transparent;background:var(--fill);font-size:15px;outline:none;transition:background .15s,border-color .15s;-webkit-appearance:none;appearance:none}
.in:focus{background:var(--surface);border-color:var(--border-strong)}
.in::placeholder{color:var(--ink-dim)}
textarea.in{height:auto;min-height:62px;padding:10px 12px;resize:vertical;line-height:1.45}
input[type=date].in{min-width:0}
.title-in{height:46px;font-size:18px;font-weight:600;letter-spacing:-.02em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two > label{display:block;min-width:0}
.pre{position:relative;display:block}
.pre > i{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:15px;color:var(--ink-dim);pointer-events:none}
.pre > .in{padding-left:24px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.cats{margin-top:10px}
.opt{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:600;color:var(--ink-mid);transition:background .12s,color .12s}
.opt svg{width:14px;height:14px}
@media (hover:hover){ .opt:hover{background:var(--fill-2)} }
.opt.on{background:var(--ink);color:#fff}
.opt .ls{display:none}
.opt.cat svg{color:var(--c)}
.opt.cat.on{background:var(--c);color:#fff}
.opt.cat.on svg{color:#fff}
.date-in{margin-top:8px;max-width:220px}
.calc{display:flex;align-items:flex-start;gap:6px;margin-top:9px;font-size:13px;line-height:1.4;color:var(--ink-mid)}
.calc svg{width:14px;height:14px;margin-top:1px}
.calc b{color:var(--ink);font-weight:600}
.calc.blue svg{color:var(--blue)}
.calc.ok svg{color:var(--green)}
.calc.warn{color:var(--red)}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{width:68px;height:68px;border-radius:11px;background:var(--fill);position:relative;overflow:hidden;flex-shrink:0}
.ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.ph.ok img{opacity:1}
.ph .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff}
.ph .rm svg{width:12px;height:12px}
button.ph{cursor:zoom-in}
.add-ph{width:68px;height:68px;border-radius:11px;border:1.5px dashed var(--border-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-mid);font-size:11.5px;font-weight:600}
.add-ph svg{width:18px;height:18px}

/* detail */
.chiprow{display:flex;gap:6px;flex-wrap:wrap;padding:14px 0 4px}
.kv{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--border);font-size:14px;line-height:1.45}
.chiprow + .kv{border-top:0}
.kv .k{font-size:12.5px;font-weight:600;color:var(--ink-mid);padding-top:1px}
.kv .v{min-width:0;overflow-wrap:anywhere}
.kv .v b{font-weight:600}
.kv .notes{white-space:pre-wrap}
.sm{font-size:12.5px;margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.sm svg{width:13px;height:13px}
.dim{color:var(--ink-dim)}
.sm.blue svg{color:var(--blue)}
.sm.ok{color:var(--green)}
.sm.warn{color:var(--red)}
.lnk{color:var(--accent-ink);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.earlier{margin-top:4px;border-top:1px solid var(--border);padding-top:12px}
.earlier .k{font-size:12.5px;font-weight:600;color:var(--ink-mid);margin-bottom:6px}
.erow{display:flex;gap:10px;align-items:baseline;width:100%;padding:7px 0;font-size:13.5px;text-align:left}
.erow + .erow{border-top:1px solid var(--border)}
.erow .d{width:92px;flex-shrink:0;font-weight:600}
.erow .w{flex:1;min-width:0;color:var(--ink-mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* photo viewer */
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(10,10,10,.92);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .15s}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lightbox .x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:rgba(255,255,255,.14);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,16px);z-index:70;max-width:calc(100vw - 32px);padding:11px 16px;border-radius:12px;background:#211E19;color:#fff;font-size:13.5px;font-weight:500;line-height:1.35;box-shadow:var(--shadow-float);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:640px){
  .in,.search input{font-size:16px} .title-in{font-size:18px}
  .sh-body{padding:4px 16px 18px}
  .sh-head{padding-left:16px}
  .opts{gap:5px}
  .opt{padding:0 9px}
  .opt .lf{display:none} .opt .ls{display:inline}
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="ttl">
      <h1>Life log</h1>
      <div class="sub" id="sub">Loading…</div>
    </div>
    <button class="btn primary" type="button" data-act="add" id="addBtn"></button>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div class="tools" id="tools" hidden>
    <label class="search"><span id="searchIc"></span><input id="q" type="search" placeholder="Search your log" autocomplete="off" aria-label="Search your log"></label>
    <div class="chips" id="chips"></div>
  </div>
  <div id="hero" hidden></div>
  <main class="grid" id="grid">
    <div class="col">
      <section>
        <div class="sec-h"><h2>Coming up</h2><span class="n" id="dueN"></span></div>
        <div id="dueList"></div>
      </section>
      <section>
        <div class="sec-h"><h2>Under warranty</h2><span class="n" id="wtyN"></span></div>
        <div id="wtyList"></div>
      </section>
    </div>
    <div class="col">
      <section>
        <div class="sec-h"><h2>History</h2><span class="n" id="logN"></span></div>
        <div id="logList"></div>
      </section>
    </div>
  </main>
  <div class="foot" id="foot"></div>
</div>

<datalist id="dlTitles"></datalist>
<datalist id="dlWhere"></datalist>
<input type="file" id="fFile" accept="image/*" multiple hidden>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden></div>
<div class="lightbox" id="lb" hidden><img id="lbImg" alt="Photo"><button class="x" type="button" data-act="lb-close" aria-label="Close photo"></button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
import { getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, getDoc, getDocFromServer, getDocsFromServer, query, where as fsWhere } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyDAWnQSN96g-zVpaeAZbaaw4btvCmGSRTs',
  authDomain: 'tv-todos.firebaseapp.com',
  projectId: 'tv-todos'
});
const db = getFirestore(app);
const COL = 'life_records';
const PHOTOS = 'life_photos';
const TASKS = 'tv_todos';
const BUILD = '2026-09-24.1';

/* =====================================================================
   Small helpers
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dkey(new Date());
const isDay = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);

  <div class="sh-foot"><span class="grow"></span><button class="btn ghost" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" data-act="save" id="fSave">Save</button></div>`;
}
function setOpts(sel, v){ document.querySelectorAll(sel + ' .opt').forEach(b => b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === String(v)))); document.querySelectorAll(sel + ' .opt').forEach(b => b.classList.toggle('on', b.getAttribute('data-v') === String(v))); }
function updCats(){
  setOpts('#fCats', F.cat);
  const mw = $('#fMilesWrap'); if (mw) mw.style.visibility = F.cat === 'car' ? '' : 'hidden';
}
function againDue(){
  if (!F.every) return '';
  if (F.every === 'date') return isDay(F.againDate) ? F.againDate : '';
  return applyTerm(F.date, F.every);
}
function updAgain(){
  setOpts('#fEvery', F.every);
  const di = $('#fAgainDate'), calc = $('#fAgainCalc'), lw = $('#fLeadWrap');
  di.hidden = F.every !== 'date';
  if (isDay(F.date)) di.min = addDays(F.date, 1);
  const due = againDue(), t = today();
  calc.hidden = !due; lw.hidden = !due;
  if (!due) return;
  const n = diffDays(t, due);
  calc.innerHTML = I.repeat + `<span>Next one <b>${fmtLong(due)}</b> · ${n === 0 ? 'today' : n > 0 ? 'in ' + span(n) : `<span style="color:var(--red)">${span(n, due)} ago</span>`}</span>`;
  setOpts('#fLead', F.lead);
  const lc = $('#fLeadCalc');
  if (F.lead < 0) { lc.className = 'calc'; lc.innerHTML = '<span>It still shows under Coming up here.</span>'; return; }
  const on = addDays(due, -F.lead);
  lc.className = 'calc blue';
  lc.innerHTML = I.bell + (on <= t ? '<span>Goes on your Personal list <b>right away</b></span>' : `<span>Shows up in Personal <b>${fmtLong(on)}</b>, then stays on top of Today until you tick it</span>`);
}
function wtyUntil(){
  if (!F.wterm) return '';
  if (F.wterm === 'date') return isDay(F.wdate) ? F.wdate : '';
  return applyTerm(F.date, F.wterm);
}
function updWty(){
  setOpts('#fWty', F.wterm);
  const di = $('#fWtyDate'), calc = $('#fWtyCalc'), rw = $('#fWRemWrap');
  di.hidden = F.wterm !== 'date';
  if (isDay(F.date)) di.min = addDays(F.date, 1);
  const u = wtyUntil();
  calc.hidden = !u; rw.hidden = !u;
  if (!u) return;
  const n = diffDays(today(), u);
  calc.innerHTML = I.shield + `<span>Covered until <b>${fmtLong(u)}</b>${n >= 0 ? ' · ' + span(n) + ' left' : ' · <span style="color:var(--red)">already ended</span>'}</span>`;
}
function updPhotos(){
  const box = $('#fPhotos'); if (!box) return;
  const kept = F.photos.filter(p => !F.removed.has(p.id));
  box.innerHTML = kept.map(p => `<div class="ph"><img data-pid="${esc(p.id)}" alt=""><button class="rm" type="button" data-act="f-rmphoto" data-id="${esc(p.id)}" aria-label="Remove photo">${I.x}</button></div>`).join('')
    + F.added.map(p => `<div class="ph ok"><img src="${p.dataUrl}" alt=""><button class="rm" type="button" data-act="f-rmadded" data-id="${esc(p.tmp)}" aria-label="Remove photo">${I.x}</button></div>`).join('')
    + (kept.length + F.added.length < 6 ? `<button class="add-ph" type="button" data-act="f-addphoto">${I.camera}<span>Add</span></button>` : '');
  hydratePhotos(box);
}
function updSave(){ const b = $('#fSave'); if (b) { b.disabled = !F.title.trim() || F.busy; b.textContent = F.busy ? 'Saving…' : 'Save'; } }
// Typing a name fills in what's probably right — the category, and the
// rhythm you used last time (or the usual one) — until you pick your own.
function onTitle(v){
  F.title = v;
  const k = keyOf(v);
  const last = k ? entries.filter(e => e.key === k).sort(byNewest)[0] : null;
  if (!F.catTouched) { F.cat = last ? last.cat : (guessCat(v) || 'other'); updCats(); }
  if (!F.everyTouched) {
    const pre = last ? (last.again && last.again.every !== 'date' ? last.again.every : '') : presetEvery(v);
    if (pre !== F.every) { F.every = pre; if (last && last.again) F.lead = Number(last.again.lead) || 0; updAgain(); }
  }
  updSave();
}
async function addPhotos(files){
  const room = 6 - (F.photos.filter(p => !F.removed.has(p.id)).length + F.added.length);
  const list = [...files].filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|heic|heif|webp|gif)$/i.test(f.name)).slice(0, Math.max(0, room));
  if (!list.length) return;
  for (const f of list) {
    try {
      const p = await shrink(f);
      if (!F) return;
      if (!p) { toast('That photo is too big to store — try a smaller one'); continue; }
      F.added.push({ tmp: newId(), ...p });
      updPhotos();
    } catch (err) { console.warn('[life] photo read', err); toast('Couldn’t read that photo — try a JPG or PNG'); }
  }
}
const numOrNull = v => { const n = parseFloat(String(v || '').replace(/[$,\s]/g, '')); return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null; };
const intOrNull = v => { const n = parseInt(String(v || '').replace(/[,\s]/g, ''), 10); return isFinite(n) && n >= 0 ? n : null; };
async function saveForm(){
  if (!F || F.busy) return;
  const title = F.title.replace(/\s+/g, ' ').trim().slice(0, 120);
  if (!title) { toast('Give it a name'); $('#fTitle')?.focus(); return; }
  if (!isDay(F.date)) { toast('Pick the date'); return; }
  if (F.date > today()) { toast('That date is in the future — log it once it’s done'); return; }
  const due = againDue();
  if (F.every && !due) { toast('Pick when it’s due again'); return; }
  if (due && due <= F.date) { toast('“Do it again” has to be after the date you did it'); return; }
  const until = wtyUntil();
  if (F.wterm && !until) { toast('Pick when the warranty ends'); return; }
  if (until && until <= F.date) { toast('The warranty has to end after the date you got it'); return; }
  F.busy = true; updSave();
  const f = F, prev = f.id ? entries.find(x => x.id === f.id) : null, id = f.id || newId(), now = new Date().toISOString();
  // A write waits for the server; on bad signal say so rather than spin.
  const slow = setTimeout(() => toast('Still saving — weak signal? Keep this open and it’ll finish.', 5000), 8000);
  try {
    const photos = f.photos.filter(p => !f.removed.has(p.id));
    for (const p of f.added) {
      const pid = newId();
      await setDoc(doc(db, PHOTOS, pid), { id: pid, entryId: id, b64: p.dataUrl, w: p.w, h: p.h, bytes: p.bytes, ts: Date.now() });
      photoMem.set(pid, p.dataUrl); IDB.put('photo:' + pid, p.dataUrl);
      photos.push({ id: pid, w: p.w, h: p.h, bytes: p.bytes });
    }
    const again = due ? { every: f.every, due, lead: f.lead } : null;
    const e = {
      id, key: keyOf(title), title, cat: f.cat, date: f.date,
      where: f.where.replace(/\s+/g, ' ').trim().slice(0, 80),
      cost: numOrNull(f.cost), miles: f.cat === 'car' ? intOrNull(f.miles) : null,
      notes: f.notes.trim().slice(0, 4000),
      again, wty: until ? { term: f.wterm, until, remind: !!f.wremind } : null,
      photos,
      // A dismissal is about that one due date: a new date brings it back.
      dismissed: prev && prev.dismissed && prev.again && again && prev.again.due === again.due ? prev.dismissed : '',
      remSync: (prev && prev.remSync) || {},
      createdAt: (prev && prev.createdAt) || now, updatedAt: now,
    };
    await setDoc(doc(db, COL, id), e);
    clearTimeout(slow);
    const i = entries.findIndex(x => x.id === id);
    if (i >= 0) entries[i] = e; else entries.push(e);
    for (const pid of f.removed) { deleteDoc(doc(db, PHOTOS, pid)).catch(() => {}); IDB.del('photo:' + pid); photoMem.delete(pid); }
    f.busy = false;
    closeSheet(true);
    render();
    const keys = [e.key];
    if (prev && prev.key !== e.key) keys.push(prev.key);
    let res = { ok: true };
    for (const k of keys) { const r = await syncSeries(k); if (k === e.key) res = r; else if (!r.ok) res = { ok: false }; }
    if (!res.ok) toast('Saved — but the reminder didn’t reach Personal. Open it and tap “Set it”.', 4200);
    else if (res.made && res.cur && res.cur.id === id) toast(`${prev ? 'Saved' : 'Logged'} · Personal reminds you ${res.made.plannedFor <= today() ? 'now' : fmt(res.made.plannedFor, true)}`, 3400);
    else if (res.madeWty && res.cur && res.cur.id === id) toast(`${prev ? 'Saved' : 'Logged'} · warranty heads-up in Personal ${res.madeWty.plannedFor <= today() ? 'now' : fmt(res.madeWty.plannedFor, true)}`, 3400);
    else if (prev && res.cur && res.cur.id !== id && prev.key === e.key) toast('Saved');
    else toast(prev ? 'Saved' : 'Logged');
    scheduleTaskCheck();
  } catch (err) {
    clearTimeout(slow);
    console.error('[life] save failed', err);
    f.busy = false;
    if (F === f) updSave();
    toast('Couldn’t save — check your connection and try again', 3600);
  }
}

// ---- actions ----
async function deleteEntry(id){
  const e = entries.find(x => x.id === id);
  if (!e) return;
  closeSheet(true);
  try {
    // Its reminders go first, so a failed delete can't strand one in Personal.
    await syncEntry(e, false);
    await deleteDoc(doc(db, COL, id));
    entries = entries.filter(x => x.id !== id);
    render();
    for (const p of e.photos || []) { deleteDoc(doc(db, PHOTOS, p.id)).catch(() => {}); IDB.del('photo:' + p.id); photoMem.delete(p.id); }
    // The one before it may be the newest again, and take the reminder back.
    const r = await syncSeries(e.key);
    toast(r.ok ? 'Deleted' : 'Deleted — but a reminder didn’t update. Open the item and tap “Set it”.', r.ok ? 2400 : 4200);
  } catch (err) {
    console.error('[life] delete failed', err);
    toast('Couldn’t delete — check your connection and try again', 3600);
  }
}
async function dismiss(id){
  const e = entries.find(x => x.id === id);
  if (!e) return;
  try {
    await updateDoc(doc(db, COL, id), { dismissed: today() });
    e.dismissed = today(); render();
    await syncSeries(e.key);
    toast('Dismissed — it’s still in History');
  } catch (err) { console.warn('[life] dismiss', err); toast('Couldn’t update that — try again'); }
}
async function retry(id){
  const e = entries.find(x => x.id === id);
  if (!e) return;
  const r = await syncSeries(e.key, true);
  toast(r.ok ? 'Reminder is in Personal' : 'Still couldn’t reach Personal — check your connection', 3000);
  scheduleTaskCheck();
}
function openPhoto(id){
  photoSrc(id).then(src => {
    if (!src) { toast('Couldn’t load that photo'); return; }
    $('#lbImg').src = src; $('#lb').hidden = false;
  });
}

/* =====================================================================
   Wiring
   ===================================================================== */
let toastT = 0;
function toast(msg, ms = 2600){
  const el = $('#toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), ms);
}
// A stray tap outside the form, or Esc, never throws away what you typed.
function softClose(){
  if (F && F.dirty) { toast('Tap Cancel to close without saving'); return; }
  closeSheet();
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b) { if (ev.target === $('#scrim')) softClose(); return; }
  if (F && /^f-/.test(b.getAttribute('data-act'))) F.dirty = true;
  const act = b.getAttribute('data-act'), id = b.getAttribute('data-id'), v = b.getAttribute('data-v');
  if (act !== 'delete' && D && D.arm) { D.arm = false; }
  switch (act) {
    case 'add': openForm(); break;
    case 'quick': { const q = QUICK[+b.getAttribute('data-i')]; if (q) openForm({ title: q.title, cat: q.cat, every: q.every, wterm: q.wterm }); break; }
    case 'open': openDetail(id); break;
    case 'again': openForm({ againFrom: id, date: b.getAttribute('data-date') || '' }); break;
    case 'edit': openForm({ edit: id }); break;
    case 'dismiss': dismiss(id); break;
    case 'retry': retry(id); break;
    case 'filter': ui.cat = v || 'all'; render(); break;
    case 'close': closeSheet(); break;
    case 'photo': openPhoto(id); break;
    case 'lb-close': $('#lb').hidden = true; $('#lbImg').removeAttribute('src'); break;
    case 'delete':
      if (!D) break;
      if (!D.arm) { D.arm = true; renderSheetIfOpen(); setTimeout(() => { if (D && D.arm) { D.arm = false; renderSheetIfOpen(); } }, 4000); }
      else deleteEntry(id);
      break;
    case 'f-cat': if (F) { F.cat = v; F.catTouched = true; updCats(); } break;
    case 'f-every':
      if (F) {
        F.every = v; F.everyTouched = true; updAgain();
        if (v === 'date') { const di = $('#fAgainDate'); try { di.showPicker(); } catch { di.focus(); } }
      }
      break;
    case 'f-lead': if (F) { F.lead = Number(v); updAgain(); } break;
    case 'f-wty':
      if (F) {
        F.wterm = v; updWty();
        if (v === 'date') { const di = $('#fWtyDate'); try { di.showPicker(); } catch { di.focus(); } }
      }
      break;
    case 'f-addphoto': $('#fFile').click(); break;
    case 'f-rmphoto': if (F) { F.removed.add(id); updPhotos(); } break;
    case 'f-rmadded': if (F) { F.added = F.added.filter(p => p.tmp !== id); updPhotos(); } break;
    case 'save': saveForm(); break;
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q') { ui.q = t.value; render(); return; }
  if (!F) return;
  F.dirty = true;
  switch (t.id) {
    case 'fTitle': onTitle(t.value); break;
    case 'fWhere': F.where = t.value; break;
    case 'fCost': F.cost = t.value; break;
    case 'fMiles': F.miles = t.value; break;
    case 'fNotes': F.notes = t.value; break;
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'fFile') { const fs = [...(t.files || [])]; t.value = ''; if (F) { F.dirty = true; addPhotos(fs); } return; }
  if (!F) return;
  F.dirty = true;
  switch (t.id) {
    case 'fDate': if (isDay(t.value)) { F.date = t.value; updAgain(); updWty(); } break;
    case 'fAgainDate': F.againDate = t.value; updAgain(); break;
    case 'fWtyDate': F.wdate = t.value; updWty(); break;
    case 'fWRem': F.wremind = t.checked; break;
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') {
    if (!$('#lb').hidden) { $('#lb').hidden = true; return; }
    if (!$('#sheet').hidden) { softClose(); return; }
  }
  if (F && ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); saveForm(); return; }
  if (F && ev.key === 'Enter' && ev.target.id === 'fTitle') { ev.preventDefault(); $('#fWhere')?.focus(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('.row[role=button]')) { ev.preventDefault(); ev.target.click(); }
});
$('#lb').addEventListener('click', ev => { if (ev.target === $('#lb')) { $('#lb').hidden = true; $('#lbImg').removeAttribute('src'); } });

/* =====================================================================
   Boot
   ===================================================================== */
$('#addBtn').innerHTML = I.plus + '<span>Log</span>';
$('#searchIc').outerHTML = I.search;
$('#lb .x').innerHTML = I.x;
$('#foot').textContent = 'Life log · build ' + BUILD;
if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
render();
IDB.get('entries').then(cached => {
  if (Array.isArray(cached) && !fresh && cached.length) { entries = cached; render(); }
});
onSnapshot(collection(db, COL), snap => {
  // A cache-only answer (offline) never blanks the copy already painted.
  if (snap.metadata.fromCache && !snap.size && entries.length) return;
  entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  if (!snap.metadata.fromCache) {
    fresh = true; loadErr = '';
    IDB.put('entries', entries);
    scheduleTaskCheck();
  }
  render();
}, err => {
  console.error('[life] load failed', err);
  loadErr = /quota|resource-exhausted/i.test(String(err && (err.code || err.message))) ? 'The database is over its daily limit — showing the copy saved on this device.' : 'Couldn’t reach the database — showing the copy saved on this device.';
  fresh = true;
  render();
});
// Tick-offs in Personal while this page sat in the background.
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !fresh) return;
  for (const [tid, st] of taskState) if (!st.done) taskState.delete(tid);
  scheduleTaskCheck();
});
// Midnight: "in 3 days" becomes "in 2 days".
(function atMidnight(){
  const n = new Date(), m = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 5);
  setTimeout(() => { render(); atMidnight(); }, m - n);
})();
</script>
