<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Food Journal — War Room</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/sync-client.js"></script>
<style>
  :root{
    --bg:#ffffff;
    --ink:#37352f;
    --muted:rgba(55,53,47,.55);
    --faint:rgba(55,53,47,.32);
    --line:rgba(55,53,47,.10);
    --gray:#f7f7f5;
    --gray2:#efefee;
    --blue:#2383e2;
    --eating:#448361;--eating-bg:rgba(68,131,97,.13);
    --feeling:#9065b0;--feeling-bg:rgba(144,101,176,.14);
    --learned:#337ea9;--learned-bg:rgba(51,126,169,.14);
    --note:#787774;--note-bg:rgba(120,119,116,.13);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  body{max-width:720px;margin:0 auto;padding:0 22px calc(96px + env(safe-area-inset-bottom));}

  .bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:max(12px,env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;justify-content:space-between;}
  .crumb{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;}
  .crumb:active{color:var(--ink);}
  .bar .lbl{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.2px;}

  .pagetitle{width:100%;border:none;outline:none;background:none;font-family:inherit;color:var(--ink);font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:30px 0 6px;}
  .intro{width:100%;border:none;outline:none;background:none;font-family:inherit;color:var(--muted);font-size:16px;font-weight:400;line-height:1.5;margin-bottom:22px;resize:none;overflow:hidden;}

  .toc{background:var(--gray);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:30px;}
  .toc-h{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;cursor:pointer;}
  .toc-h .t{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);}
  .toc-h .chev{color:var(--faint);font-size:12px;transition:transform .18s;}
  .toc.collapsed .chev{transform:rotate(-90deg);}
  .toc.collapsed .toc-list{display:none;}
  .toc-list{display:flex;flex-direction:column;}
  .toc-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer;text-decoration:none;}
  .toc-link:hover{background:var(--gray2);}
  .toc-dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--note);}
  .toc-dot.eating{background:var(--eating);}.toc-dot.feeling{background:var(--feeling);}.toc-dot.learned{background:var(--learned);}
  .toc-t{flex:1;min-width:0;font-size:14.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .toc-d{flex:0 0 auto;font-size:12px;color:var(--faint);}
  .toc-empty{padding:8px 10px;color:var(--faint);font-size:13.5px;}

  .entry{padding:14px 0 18px;border-top:1px solid var(--line);scroll-margin-top:70px;}
  .entry:first-of-type{border-top:none;}
  .entry-meta{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .edate{font-size:12.5px;font-weight:600;color:var(--faint);}
  .etag{font-family:inherit;font-size:11px;font-weight:700;border:none;border-radius:6px;padding:3px 8px 3px 8px;cursor:pointer;outline:none;-webkit-appearance:none;appearance:none;background:var(--note-bg);color:var(--note);}
  .etag.eating{background:var(--eating-bg);color:var(--eating);}.etag.feeling{background:var(--feeling-bg);color:var(--feeling);}.etag.learned{background:var(--learned-bg);color:var(--learned);}
  .edel{margin-left:auto;background:none;border:none;color:var(--faint);font-family:inherit;font-size:12px;cursor:pointer;}
  .edel:active{color:#c0392b;}
  .etitle{width:100%;border:none;outline:none;background:none;font-family:inherit;color:var(--ink);font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin-bottom:4px;}
  .etitle::placeholder{color:var(--faint);}
  .ebody{width:100%;border:none;outline:none;background:none;font-family:inherit;color:var(--ink);font-size:16px;font-weight:400;line-height:1.7;resize:none;overflow:hidden;min-height:28px;}
  .ebody::placeholder{color:var(--faint);}

  .dock{position:fixed;left:0;right:0;bottom:0;padding:12px 22px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);}
  .dock .inner{max-width:720px;margin:0 auto;}
  .newbtn{width:100%;border:none;border-radius:12px;padding:15px;font-family:inherit;font-weight:700;font-size:15px;background:var(--ink);color:#fff;cursor:pointer;transition:transform .12s,opacity .15s;}
  .newbtn:active{transform:scale(.98);}

  @media(min-width:760px){body{max-width:800px;}.dock .inner{max-width:800px;}}
  @media(max-width:420px){.pagetitle{font-size:32px;}}
</style>
</head>
<body>
<div class="bar">
  <a class="crumb" href="/meal-tracker.html">&#8249; Meals</a>
  <span class="lbl">Food Journal</span>
</div>

<input class="pagetitle" id="pageTitle" placeholder="My Food Journal" oninput="updateMeta()">
<textarea class="intro" id="intro" rows="1" placeholder="What this journal is about..." oninput="updateMeta();grow(this)"></textarea>

<div class="toc" id="toc">
  <div class="toc-h" onclick="document.getElementById('toc').classList.toggle('collapsed')">
    <span class="t">Contents</span><span class="chev">&#9662;</span>
  </div>
  <div class="toc-list" id="tocList"></div>
</div>

<div id="entries"></div>

<div class="dock"><div class="inner">
  <button class="newbtn" onclick="addEntry()">+ New entry</button>
</div></div>

<script>
const JKEY="food-journal-v1";
const TAGS=["Note","Eating","Feeling","Learned"];
let model=null,saveT=null;

function uid(){return "j"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function attr(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;");}
function ctToday(){return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Chicago"}).format(new Date());}
function niceFull(){return new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",month:"long",day:"numeric",year:"numeric"}).format(new Date());}
function fmtDate(iso){if(!iso)return"";const[y,m,d]=iso.split("-").map(Number);const dt=new Date(Date.UTC(y,m-1,d,12));return new Intl.DateTimeFormat("en-US",{timeZone:"UTC",month:"short",day:"numeric"}).format(dt);}
function tagClass(t){return (t||"Note").toLowerCase();}

function blankModel(){return {title:"My Food Journal",intro:"A running journal of what I eat, how I feel, and what I learn about food.",entries:[
  {id:uid(),date:ctToday(),title:niceFull(),tag:"Note",body:"Start here. Each day, jot down what you ate, how your body felt afterward, and anything you learned about food. Tap + New entry to add a new day or thought."}
]};}
function loadJ(){try{const m=JSON.parse(localStorage.getItem(JKEY));if(m&&Array.isArray(m.entries))return m;}catch(e){}return null;}
function saveJ(){localStorage.setItem(JKEY,JSON.stringify(model));}
function queueSave(){clearTimeout(saveT);saveT=setTimeout(saveJ,400);}
function ensureJ(){if(!loadJ())localStorage.setItem(JKEY,JSON.stringify(blankModel()));}

function grow(ta){ta.style.height="auto";ta.style.height=ta.scrollHeight+"px";}

function renderAll(){
  model=loadJ()||blankModel();
  document.getElementById("pageTitle").value=model.title||"";
  const intro=document.getElementById("intro");intro.value=model.intro||"";grow(intro);
  renderTOC();
  const el=document.getElementById("entries");
  el.innerHTML=model.entries.map((e,i)=>{
    const opts=TAGS.map(t=>'<option value="'+t+'"'+((e.tag||"Note")===t?" selected":"")+'>'+t+'</option>').join("");
    return '<div class="entry" id="entry-'+e.id+'">'+
      '<div class="entry-meta"><span class="edate">'+fmtDate(e.date)+'</span>'+
        '<select class="etag '+tagClass(e.tag)+'" onchange="updateTag('+i+',this.value)">'+opts+'</select>'+
        '<button class="edel" onclick="delEntry(\''+e.id+'\')">Delete</button></div>'+
      '<input class="etitle" value="'+attr(e.title)+'" placeholder="Untitled" oninput="updateTitle('+i+',this.value)">'+
      '<textarea class="ebody" placeholder="Write what you ate, how you felt, what you learned..." oninput="updateBody('+i+',this.value,this)">'+esc(e.body||"")+'</textarea>'+
    '</div>';
  }).join("");
  el.querySelectorAll(".ebody").forEach(grow);
}
function renderTOC(){
  const el=document.getElementById("tocList");
  if(!model.entries.length){el.innerHTML='<div class="toc-empty">No entries yet.</div>';return;}
  el.innerHTML=model.entries.map(e=>'<a class="toc-link" onclick="jump(\''+e.id+'\')"><span class="toc-dot '+tagClass(e.tag)+'"></span><span class="toc-t">'+esc(e.title||"Untitled")+'</span><span class="toc-d">'+fmtDate(e.date)+'</span></a>').join("");
}
function updateMeta(){model.title=document.getElementById("pageTitle").value;model.intro=document.getElementById("intro").value;queueSave();}
function updateTitle(i,v){if(model.entries[i]){model.entries[i].title=v;queueSave();renderTOC();}}
function updateBody(i,v,ta){if(model.entries[i]){model.entries[i].body=v;queueSave();}grow(ta);}
function updateTag(i,v){if(model.entries[i]){model.entries[i].tag=v;queueSave();renderTOC();}const sel=document.querySelectorAll(".entry")[i]?.querySelector(".etag");if(sel)sel.className="etag "+tagClass(v);}
function addEntry(){model=loadJ()||blankModel();model.entries.unshift({id:uid(),date:ctToday(),title:niceFull(),tag:"Note",body:""});saveJ();renderAll();const first=document.querySelector(".etitle");if(first){first.focus();first.select();}window.scrollTo({top:0,behavior:"smooth"});}
function delEntry(id){if(!confirm("Delete this entry?"))return;model.entries=model.entries.filter(e=>e.id!==id);saveJ();renderAll();}
function jump(id){const el=document.getElementById("entry-"+id);if(el){el.scrollIntoView({behavior:"smooth",block:"start"});const t=el.querySelector(".etitle");if(t)setTimeout(()=>t.focus(),350);}}

document.addEventListener("warroom:cloud-ready",()=>{ensureJ();renderAll();});
ensureJ();renderAll();
</script>
</body>
</html>
