<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Food Journal — War Room</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/sync-client.js"></script>
<style>
  :root{
    --bg:#ffffff;--ink:#37352f;--muted:rgba(55,53,47,.55);--faint:rgba(55,53,47,.32);
    --line:rgba(55,53,47,.10);--gray:#f7f7f5;--gray2:#efefee;--blue:#2383e2;
    --eating:#448361;--eating-bg:rgba(68,131,97,.13);
    --feeling:#9065b0;--feeling-bg:rgba(144,101,176,.14);
    --learned:#337ea9;--learned-bg:rgba(51,126,169,.14);
    --note:#787774;--note-bg:rgba(120,119,116,.13);
    --ff:#c0392b;--ff-bg:rgba(192,57,43,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  body{max-width:720px;margin:0 auto;padding:0 22px calc(96px + env(safe-area-inset-bottom));}

  .bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:max(12px,env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .crumb{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;}
  .crumb:active{color:var(--ink);}
  .barlinks{display:flex;gap:14px;}
  .barlinks a{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;}
  .barlinks a:active{color:var(--ink);}

  .pagetitle{width:100%;border:none;outline:none;background:none;font-family:inherit;color:var(--ink);font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:28px 0 6px;}
  .intro{width:100%;border:none;outline:none;background:none;font-family:inherit;color:var(--muted);font-size:16px;font-weight:400;line-height:1.5;margin-bottom:22px;resize:none;overflow:hidden;}

  .toc{background:var(--gray);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:30px;}
  .toc-h{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;cursor:pointer;}
  .toc-h .t{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);}
  .toc-h .chev{color:var(--faint);font-size:12px;transition:transform .18s;}
  .toc.collapsed .chev{transform:rotate(-90deg);}
  .toc.collapsed .toc-list{display:none;}
  .toc-list{display:flex;flex-direction:column;}
  .toc-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer;text-decoration:none;}
  .toc-link:hover{background:var(--gray2);}
  .toc-dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--blue);}
  .toc-t{flex:1;min-width:0;font-size:14.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .toc-d{flex:0 0 auto;font-size:12px;color:var(--faint);}

  .sec-h{font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:4px 0 12px;}
  .sec-h.collapser{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .sec-h .chev{font-size:11px;color:var(--faint);transition:transform .18s;}
  .planblock.collapsed .chev{transform:rotate(-90deg);}
  .planblock.collapsed #planWeek{display:none;}
  .toollinks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
  .toollinks a{font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;background:var(--gray);border:1px solid var(--line);border-radius:980px;padding:7px 14px;}
  .toollinks a:active{background:var(--gray2);}
  .slashmenu{display:flex;flex-direction:column;}
  .slashmenu button{text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:13px 4px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:2px;}
  .slashmenu button:last-child{border-bottom:none;}
  .slashmenu b{font-size:15px;font-weight:600;color:var(--ink);}
  .slashmenu span{font-size:12.5px;color:var(--muted);}
  /* attached recipe cards in a day */
  .jrsec{font-size:12px;font-weight:700;color:var(--faint);margin:2px 0 7px;}
  .jrec{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 9px;margin-bottom:8px;cursor:pointer;}
  .jrthumb{flex:0 0 auto;width:48px;height:48px;border-radius:8px;overflow:hidden;background:var(--gray2);}
  .jrthumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .jrbody{flex:1;min-width:0;}
  .jrt{font-size:14.5px;font-weight:600;line-height:1.25;}
  .jrsrc{font-size:11px;color:var(--muted);margin-top:2px;}
  .jrwant{font-size:11px;font-weight:700;color:var(--feeling);margin-top:2px;}
  .jrx{flex:0 0 auto;background:none;border:none;color:var(--faint);font-size:18px;line-height:1;cursor:pointer;padding:0 2px;}
  /* pick filters + thumbnails */
  .pfilters{display:flex;gap:7px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none;}
  .pfilters::-webkit-scrollbar{display:none;}
  .ppill{flex:0 0 auto;border:1px solid var(--line);background:var(--gray);color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:980px;cursor:pointer;}
  .ppill.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .ppthumb{flex:0 0 auto;width:40px;height:40px;border-radius:7px;overflow:hidden;background:var(--gray2);}
  .ppthumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .ppt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ppc{flex:0 0 auto;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--faint);}
  /* recipe view modal */
  .rvimg{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;margin-bottom:12px;background:var(--gray2);}
  .rvsrc{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--eating);}
  .rvtitle{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:3px 0 10px;}
  .rvlink{display:inline-block;color:var(--blue);font-weight:600;font-size:14px;text-decoration:none;margin-bottom:8px;}
  .rvh{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:14px 0 7px;}
  .rvli{font-size:14.5px;line-height:1.5;color:var(--ink);padding:7px 11px;background:var(--gray);border:1px solid var(--line);border-radius:8px;margin-bottom:5px;}

  /* plan */
  .planblock{margin-bottom:34px;}
  .pmeal{margin-bottom:14px;}
  .pmeal-h{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--faint);margin:0 2px 7px;}
  .pslot{display:flex;align-items:center;gap:10px;width:100%;border-radius:10px;padding:8px 10px;margin-bottom:7px;font-family:inherit;font-size:14px;font-weight:600;}
  .pslot.filled{background:var(--gray);border:1px solid var(--line);color:var(--ink);}
  .pthumb{flex:0 0 auto;width:42px;height:42px;border-radius:8px;overflow:hidden;background:var(--gray2);}
  .pthumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .ptitle{flex:1;min-width:0;line-height:1.25;}
  .psw,.prm{flex:0 0 auto;background:none;border:none;color:var(--faint);cursor:pointer;line-height:1;}
  .psw{font-size:15px;}.prm{font-size:18px;}
  .pslot.empty{background:none;border:1px dashed var(--line);color:var(--muted);cursor:pointer;justify-content:flex-start;}

  /* day blocks */
  .day{padding:16px 0 20px;border-top:1px solid var(--line);scroll-margin-top:70px;}
  .day-h{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-bottom:12px;}
  .meals{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .meal{display:flex;align-items:center;gap:11px;background:var(--gray);border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
  .mthumb{flex:0 0 auto;width:52px;height:52px;border-radius:8px;overflow:hidden;background:var(--gray2);}
  .mthumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .mbody{flex:1;min-width:0;}
  .mtop{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .mtype{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--eating);}
  .mwhere{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--note);background:var(--note-bg);padding:2px 6px;border-radius:5px;}
  .mwhere.ff{color:var(--ff);background:var(--ff-bg);}
  .mtime{font-size:11px;color:var(--faint);font-weight:600;}
  .mnote{font-size:13.5px;color:var(--ink);line-height:1.4;margin-top:3px;}
  .mdel{flex:0 0 auto;background:none;border:none;color:var(--faint);font-size:18px;line-height:1;cursor:pointer;padding:0 2px;}
  .addbite{background:none;border:1px dashed var(--line);color:var(--muted);font-family:inherit;font-weight:600;font-size:13.5px;border-radius:9px;padding:10px 12px;cursor:pointer;width:100%;text-align:left;margin-bottom:12px;}
  .thoughts{width:100%;border:none;outline:none;background:none;font-family:inherit;color:var(--ink);font-size:16px;font-weight:400;line-height:1.7;resize:none;overflow:hidden;min-height:30px;}
  .thoughts::placeholder{color:var(--faint);}

  .dock{position:fixed;left:0;right:0;bottom:0;padding:12px 22px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);}
  .dock .inner{max-width:720px;margin:0 auto;}
  .newbtn{width:100%;border:none;border-radius:12px;padding:15px;font-family:inherit;font-weight:700;font-size:15px;background:var(--ink);color:#fff;cursor:pointer;}
  .newbtn:active{transform:scale(.98);}

  /* sheets */
  .scrim{position:fixed;inset:0;background:rgba(15,15,15,.4);opacity:0;pointer-events:none;transition:.2s;z-index:50;}
  .scrim.on{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;background:#fff;border-top-left-radius:20px;border-top-right-radius:20px;border:1px solid var(--line);border-bottom:none;padding:16px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.85,.25,1);z-index:60;max-height:90vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.14);}
  .sheet.on{transform:none;}
  .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px;}
  .sheet h2{font-size:19px;font-weight:700;margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:7px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{border:1px solid var(--line);background:var(--gray);color:var(--ink);padding:9px 13px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .chip.sel{background:var(--ink);color:#fff;border-color:var(--ink);}
  textarea.tf,input.tf{width:100%;background:var(--gray);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:inherit;font-size:15px;padding:11px;resize:none;outline:none;}
  .photo-pick{width:100%;aspect-ratio:4/3;border:1px dashed var(--line);border-radius:12px;background:var(--gray);display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;overflow:hidden;position:relative;}
  .photo-pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .photo-pick .ph{text-align:center;z-index:1;}.photo-pick .ph .ic{font-size:30px;}.photo-pick .ph .t{font-size:13px;margin-top:5px;}
  .save-row{display:flex;gap:9px;margin-top:4px;}
  .save-row .pri{flex:1;background:var(--ink);color:#fff;}
  .btn{border:none;border-radius:11px;padding:14px;font-family:inherit;font-weight:700;font-size:14.5px;cursor:pointer;}
  .btn.ghost{background:var(--gray);color:var(--ink);border:1px solid var(--line);}
  .picklist{max-height:60vh;overflow:auto;display:flex;flex-direction:column;gap:6px;}
  .ppick{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:var(--gray);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:10px 16px;border-radius:11px;opacity:0;pointer-events:none;transition:.25s;z-index:80;}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(min-width:760px){body{max-width:820px;}.dock .inner{max-width:820px;}}
  @media(max-width:420px){.pagetitle{font-size:32px;}}
</style>
</head>
<body>
<div class="bar">
  <a class="crumb" href="/">&#8249; War Room</a>
</div>

<input class="pagetitle" id="pageTitle" placeholder="My Food Journal" oninput="updateMeta()">
<textarea class="intro" id="intro" rows="1" placeholder="What this journal is about..." oninput="updateMeta();grow(this)"></textarea>

<div class="toollinks">
  <a href="/meal-tracker.html?tab=recipes">Recipes</a>
  <a href="/meal-tracker.html?tab=daily">Vitamins</a>
  <a href="/meal-tracker.html?tab=cook">Cook tips</a>
  <a href="/eat-well.html">Eating tips</a>
</div>

<div class="toc" id="toc">
  <div class="toc-h" onclick="document.getElementById('toc').classList.toggle('collapsed')">
    <span class="t">Contents</span><span class="chev">&#9662;</span>
  </div>
  <div class="toc-list" id="tocList"></div>
</div>

<div class="planblock collapsed" id="planSection">
  <div class="sec-h collapser" onclick="document.getElementById('planSection').classList.toggle('collapsed')">This week — the plan <span class="chev">&#9662;</span></div>
  <div id="planWeek"></div>
</div>

<div class="sec-h">The days</div>
<div id="days"></div>

<div class="dock"><div class="inner">
  <button class="newbtn" onclick="openAdd(todayKey())">+ Log a bite today</button>
</div></div>

<!-- add bite -->
<div class="scrim" id="scrimAdd" onclick="closeAdd(event)"></div>
<div class="sheet" id="sheetAdd">
  <div class="grab"></div>
  <h2 id="addTitle">Log a bite</h2>
  <div class="field"><label>Photo</label>
    <div class="photo-pick" id="photoPick" onclick="document.getElementById('file').click()"><div class="ph"><div class="ic">+</div><div class="t">Tap to take or choose a photo</div></div></div>
    <input type="file" id="file" accept="image/*" capture="environment" hidden onchange="onPhoto(event)">
  </div>
  <div class="field"><label>Type</label><div class="chips" id="typeChips"></div></div>
  <div class="field"><label>Where (optional)</label><div class="chips" id="whereChips"></div></div>
  <div class="field"><label>Note (optional)</label><textarea class="tf" id="note" rows="2" placeholder="how it tasted, how you felt after... (type -- for an em dash)" oninput="emDash(this)"></textarea></div>
  <div class="save-row"><button class="btn pri" onclick="saveEntry()">Save</button><button class="btn ghost" onclick="closeAdd()">Cancel</button></div>
</div>

<!-- slash command menu -->
<div class="scrim" id="scrimSlash" onclick="closeSlash(event)"></div>
<div class="sheet" id="sheetSlash">
  <div class="grab"></div>
  <h2>Insert</h2>
  <div class="slashmenu">
    <button onclick="slashPickRecipe('ref')"><b>Recipe</b><span>drop in a recipe from your list</span></button>
    <button onclick="slashPickRecipe('want')"><b>Want to cook</b><span>flag a recipe you want</span></button>
    <button onclick="slashAction('meal')"><b>Log a meal photo</b><span>snap what you ate</span></button>
    <button onclick="slashAction('todo')"><b>Checklist item</b><span>a [ ] to tick off</span></button>
    <button onclick="slashAction('date')"><b>Today's date</b><span>insert today</span></button>
    <button onclick="slashAction('divider')"><b>Divider</b><span>a line break</span></button>
  </div>
</div>

<!-- plan pick -->
<div class="scrim" id="scrimPick" onclick="closePick(event)"></div>
<div class="sheet" id="sheetPick">
  <div class="grab"></div>
  <h2 id="pickTitle">Add a recipe</h2>
  <input class="tf" id="pickSearch" placeholder="Search recipes or tags" oninput="renderPick()" style="margin-bottom:10px;">
  <div class="pfilters" id="pickFilters"></div>
  <div id="pickList" class="picklist"></div>
</div>

<!-- recipe view -->
<div class="scrim" id="scrimRview" onclick="closeRview(event)"></div>
<div class="sheet" id="sheetRview"><div class="grab"></div><div id="rviewBody"></div></div>

<div class="toast" id="toast"></div>

<script>
/* shared keys with the meal tracker — same data, no duplication */
const LOG_KEY="meal-log-v1",PLAN_KEY="meal-plan-v1",RECIPE_KEY="meal-recipes-v1",JKEY="food-journal-v1";
const TYPES=["Breakfast","Lunch","Dinner","Snack","Drink"];
const WHERES=["Home","Takeout","Fast food","Restaurant"];
const MEALS=["Breakfast","Lunch","Dinner"],SLOTS_PER=2;
let model=null,saveT=null,pendingPhoto=null,pendingType="Breakfast",pendingWhere="",pendingDay=null,pickMeal=null,pickCat="all";

function uid(){return "j"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function attr(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;");}
function grow(ta){ta.style.height="auto";ta.style.height=ta.scrollHeight+"px";}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("on"),1800);}

/* time (Central) */
function ctParts(d){return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);}
function ctTime(t){return new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",hour:"numeric",minute:"2-digit"}).format(new Date(t));}
function ctHour(){return parseInt(new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",hour:"numeric",hour12:false}).format(new Date()),10);}
function todayKey(){return ctParts(new Date());}
function prevKey(k){const[y,m,d]=k.split("-").map(Number);const dt=new Date(Date.UTC(y,m-1,d,12));dt.setUTCDate(dt.getUTCDate()-1);return ctParts(dt);}
function dayFull(k){const[y,m,d]=k.split("-").map(Number);const dt=new Date(Date.UTC(y,m-1,d,12));return new Intl.DateTimeFormat("en-US",{timeZone:"UTC",weekday:"long",month:"long",day:"numeric"}).format(dt);}
function dayShort(k){const[y,m,d]=k.split("-").map(Number);const dt=new Date(Date.UTC(y,m-1,d,12));return new Intl.DateTimeFormat("en-US",{timeZone:"UTC",month:"short",day:"numeric"}).format(dt);}

/* photos in IndexedDB (same DB the tracker uses) */
let _db=null;
function db(){return new Promise((res,rej)=>{if(_db)return res(_db);const r=indexedDB.open("mealtracker",1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains("photos"))d.createObjectStore("photos");};r.onsuccess=e=>{_db=e.target.result;res(_db);};r.onerror=e=>rej(e);});}
async function getPhoto(id){const d=await db();return new Promise(res=>{const tx=d.transaction("photos","readonly");const rq=tx.objectStore("photos").get(id);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);});}
async function putPhoto(id,u){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction("photos","readwrite");tx.objectStore("photos").put(u,id);tx.oncomplete=res;tx.onerror=rej;});}
async function delPhoto(id){const d=await db();return new Promise(res=>{const tx=d.transaction("photos","readwrite");tx.objectStore("photos").delete(id);tx.oncomplete=res;tx.onerror=res;});}
function compress(file,cb){const img=new Image(),r=new FileReader();r.onload=()=>img.src=r.result;img.onload=()=>{const max=1000;let{width:w,height:h}=img;if(w>h&&w>max){h=h*max/w;w=max;}else if(h>=w&&h>max){w=w*max/h;h=max;}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);cb(c.toDataURL("image/jpeg",0.7));};r.readAsDataURL(file);}

/* meal log */
function loadLog(){try{return JSON.parse(localStorage.getItem(LOG_KEY))||{};}catch(e){return {};}}
function saveLog(o){localStorage.setItem(LOG_KEY,JSON.stringify(o));}
function dayEntries(k){const l=loadLog();return (l[k]||[]).slice().sort((a,b)=>a.t-b.t);}

/* recipes + plan */
function loadRecipes(){try{return JSON.parse(localStorage.getItem(RECIPE_KEY))||[];}catch(e){return [];}}
function recipeById(id){return loadRecipes().find(r=>r.id===id);}
const CATS=[
  {key:"pasta",m:["pasta","spaghetti","linguine","ziti","lasagna","orzo","fettuccine","capellini","shells","norcina","genovese","macaroni"]},
  {key:"chicken",m:["chicken","poultry","turkey"]},
  {key:"meat",m:["beef","pork","steak","braciole","meatball","ribs","bourguignon","peposo","stracotto","sausage","lamb"]},
  {key:"seafood",m:["seafood","fish","shrimp","clam","mussel","tuna","salmon","saganaki","oreganata","scampi","chowder"]},
  {key:"salad",m:["salad"]},
  {key:"veg",m:["vegetable","veg","side","vegetarian","broccoli","artichoke","pepper","spinach","potato","bread","eggplant","greens","bean"]}
];
function recipeCat(r){if(r.cat)return r.cat;const hay=((r.title||"")+" "+((r.tags||[]).join(" "))+" "+(r.category||"")).toLowerCase();for(const c of CATS){if(c.m.some(x=>hay.includes(x)))return c.key;}return "other";}
const CAT_ORDER=CATS.map(c=>c.key).concat(["other"]);
function CAT_LABEL(k){return ({pasta:"Pasta",chicken:"Chicken",meat:"Beef & Pork",seafood:"Seafood",salad:"Salads",veg:"Veg & Sides"}[k])||"Other";}
function ensureDay(k){model.days=model.days||{};let d=model.days[k];if(typeof d==="string")d={note:d,recipes:[]};if(!d)d={note:"",recipes:[]};if(!Array.isArray(d.recipes))d.recipes=[];model.days[k]=d;return d;}
function dayNote(k){const d=model.days&&model.days[k];if(!d)return "";return typeof d==="string"?d:(d.note||"");}
function dayRecipes(k){const d=model.days&&model.days[k];if(!d||typeof d==="string")return [];return d.recipes||[];}
function healthyPool(){return loadRecipes().filter(r=>{const c=recipeCat(r);const tags=(r.tags||[]).map(t=>String(t).toLowerCase());if(["seafood","salad","veg"].includes(c))return true;return tags.some(t=>["veg","vegetables","salad","fish","seafood","fiber","light","lean","fermented","greens"].includes(t));});}
function loadPlan(){try{return JSON.parse(localStorage.getItem(PLAN_KEY))||{};}catch(e){return {};}}
function savePlan(p){localStorage.setItem(PLAN_KEY,JSON.stringify(p));}
function weekStart(){const[y,m,d]=todayKey().split("-").map(Number);const dt=new Date(Date.UTC(y,m-1,d,12));const dow=dt.getUTCDay();const off=(dow===0?-6:1-dow);dt.setUTCDate(dt.getUTCDate()+off);return ctParts(dt);}
function planFor(){return loadPlan()[weekStart()]||{};}
function fillSlots(p,w){const pool=healthyPool();if(!pool.length)return;p[w]=p[w]||{};let idx=Math.floor(Math.random()*pool.length);MEALS.forEach(meal=>{p[w][meal]=p[w][meal]||[];let g=0;while(p[w][meal].length<SLOTS_PER&&g++<pool.length*2){const c=pool[idx%pool.length].id;idx++;if(!p[w][meal].includes(c))p[w][meal].push(c);}});}
function ensurePrefill(){const p=loadPlan(),w=weekStart();p._seeded=p._seeded||{};if(p._seeded[w])return;if(!healthyPool().length)return;fillSlots(p,w);p._seeded[w]=true;savePlan(p);}
function planSwap(meal,oldId){const pool=healthyPool();if(!pool.length)return;const p=loadPlan(),w=weekStart();if(!p[w]||!p[w][meal])return;const used=new Set();MEALS.forEach(m=>(p[w][m]||[]).forEach(id=>used.add(id)));const cand=pool.map(r=>r.id).filter(id=>!used.has(id));const pick=cand.length?cand[Math.floor(Math.random()*cand.length)]:pool[Math.floor(Math.random()*pool.length)].id;const arr=p[w][meal],i=arr.indexOf(oldId);if(i<0)return;arr[i]=pick;savePlan(p);renderPlan();}
function planRemove(meal,id){const p=loadPlan(),w=weekStart();if(p[w]&&p[w][meal]){p[w][meal]=p[w][meal].filter(x=>x!==id);if(!p[w][meal].length)delete p[w][meal];}savePlan(p);renderPlan();}
function planAdd(meal,id){const p=loadPlan(),w=weekStart();p[w]=p[w]||{};p[w][meal]=p[w][meal]||[];if(p[w][meal].length>=SLOTS_PER){toast(meal+" is full");return false;}if(!p[w][meal].includes(id))p[w][meal].push(id);savePlan(p);renderPlan();return true;}

/* journal model (per-day notes) */
function loadJ(){
  let m=null;try{m=JSON.parse(localStorage.getItem(JKEY));}catch(e){}
  if(!m)return null;
  if(!m.days){ // migrate old {entries:[]} shape
    const days={};(m.entries||[]).forEach(e=>{const k=e.date||todayKey();days[k]=(days[k]?days[k]+"\n\n":"")+((e.title&&e.title!==e.date)?e.title+"\n":"")+(e.body||"");});
    m={title:m.title||"My Food Journal",intro:m.intro||"",days};
  }
  return m;
}
function saveJ(){localStorage.setItem(JKEY,JSON.stringify(model));}
function queueSave(){clearTimeout(saveT);saveT=setTimeout(saveJ,400);}
function blankModel(){return {title:"My Food Journal",intro:"What I eat, how I feel, and what I learn — all in one place.",days:{}};}

/* ---------- render ---------- */
function dayKeys(){const s=new Set([todayKey()]);Object.keys(loadLog()).forEach(k=>s.add(k));Object.keys(model.days||{}).forEach(k=>{if(dayNote(k).trim()||dayRecipes(k).length)s.add(k);});return [...s].sort().reverse();}

function renderAll(){
  model=loadJ()||blankModel();
  document.getElementById("pageTitle").value=model.title||"";
  const intro=document.getElementById("intro");intro.value=model.intro||"";grow(intro);
  ensurePrefill();
  renderPlan();
  renderDays();
  renderTOC();
}
function renderTOC(){
  const el=document.getElementById("tocList");let h='<a class="toc-link" onclick="document.getElementById(\'planSection\').classList.remove(\'collapsed\');jump(\'planSection\')"><span class="toc-dot"></span><span class="toc-t">This week — the plan</span></a>';
  dayKeys().forEach(k=>{h+='<a class="toc-link" onclick="jump(\'day-'+k+'\')"><span class="toc-dot" style="background:var(--eating)"></span><span class="toc-t">'+esc(dayFull(k))+'</span><span class="toc-d">'+dayShort(k)+'</span></a>';});
  el.innerHTML=h;
}
function renderPlan(){
  const wp=planFor(),el=document.getElementById("planWeek");
  el.innerHTML=MEALS.map(meal=>{
    const ids=wp[meal]||[];let slots="";
    for(let i=0;i<SLOTS_PER;i++){
      const id=ids[i],r=id?recipeById(id):null;
      if(r)slots+='<div class="pslot filled">'+(r.img?'<div class="pthumb"><img src="'+esc(r.img)+'" onerror="this.parentNode.style.display=\'none\'"></div>':'<div class="pthumb"></div>')+'<span class="ptitle">'+esc(r.title)+'</span><button class="psw" onclick="planSwap(\''+meal+'\',\''+id+'\')" title="Swap">&#8635;</button><button class="prm" onclick="planRemove(\''+meal+'\',\''+id+'\')">&times;</button></div>';
      else slots+='<button class="pslot empty" onclick="openPick(\''+meal+'\')">+ Add '+meal.toLowerCase()+'</button>';
    }
    return '<div class="pmeal"><div class="pmeal-h">'+meal+'</div>'+slots+'</div>';
  }).join("");
}
function renderDays(){
  const el=document.getElementById("days");
  el.innerHTML=dayKeys().map(k=>{
    const entries=dayEntries(k);
    const meals=entries.map(e=>{
      const w=e.source?'<span class="mwhere'+(e.source==="Fast food"?" ff":"")+'">'+esc(e.source)+'</span>':'';
      return '<div class="meal">'+(e.photo?'<div class="mthumb"><img alt="" data-pid="'+e.id+'"></div>':'')+
        '<div class="mbody"><div class="mtop"><span class="mtype">'+esc(e.type)+'</span>'+w+'<span class="mtime">'+ctTime(e.t)+'</span></div>'+
        (e.note?'<div class="mnote">'+esc(e.note)+'</div>':'')+'</div>'+
        '<button class="mdel" onclick="delEntry(\''+k+'\',\''+e.id+'\')" aria-label="remove">&times;</button></div>';
    }).join("");
    const recs=dayRecipes(k).map((ref,ri)=>{
      const r=recipeById(ref.id);if(!r)return"";
      return '<div class="jrec" onclick="openRecipeModal(\''+esc(ref.id)+'\')">'+
        (r.img?'<div class="jrthumb"><img src="'+esc(r.img)+'" onerror="this.parentNode.style.display=\'none\'"></div>':'<div class="jrthumb"></div>')+
        '<div class="jrbody"><div class="jrt">'+esc(r.title)+'</div>'+(ref.want?'<div class="jrwant">Want to cook</div>':'<div class="jrsrc">'+esc(r.source||"Recipe")+'</div>')+'</div>'+
        '<button class="jrx" onclick="event.stopPropagation();detachRecipe(\''+k+'\','+ri+')" aria-label="remove">&times;</button></div>';
    }).join("");
    const note=dayNote(k);
    return '<div class="day" id="day-'+k+'">'+
      '<div class="day-h">'+esc(dayFull(k))+(k===todayKey()?' — today':'')+'</div>'+
      (meals?'<div class="meals">'+meals+'</div>':'')+
      (recs?'<div class="jrsec">Recipes</div>'+recs:'')+
      '<button class="addbite" onclick="openAdd(\''+k+'\')">+ Log a bite</button>'+
      '<textarea class="thoughts" placeholder="Write your thoughts... type / to insert a recipe, checklist, and more" oninput="onThoughts(\''+k+'\',this)">'+esc(note)+'</textarea>'+
    '</div>';
  }).join("");
  el.querySelectorAll(".thoughts").forEach(grow);
  el.querySelectorAll("img[data-pid]").forEach(im=>{getPhoto(im.getAttribute("data-pid")).then(u=>{if(u)im.src=u;else im.parentNode.style.display="none";});});
}
function detachRecipe(k,ri){const d=ensureDay(k);d.recipes.splice(ri,1);queueSave();renderDays();renderTOC();}
function openRecipeModal(id){
  const r=recipeById(id);if(!r)return;
  const ings=r.ingredients||[],steps=r.steps||[];
  document.getElementById("rviewBody").innerHTML=
    (r.img?'<img class="rvimg" src="'+esc(r.img)+'" onerror="this.style.display=\'none\'">':'')+
    '<div class="rvsrc">'+esc(r.source||"Recipe")+'</div>'+
    '<div class="rvtitle">'+esc(r.title)+'</div>'+
    (r.url?'<a class="rvlink" href="'+encodeURI(r.url)+'" target="_blank" rel="noopener">Open full recipe &#8599;</a>':'')+
    (ings.length?'<div class="rvh">Ingredients</div>'+ings.map(x=>'<div class="rvli">'+esc(x)+'</div>').join(""):'')+
    (steps.length?'<div class="rvh">Steps</div>'+steps.map((x,i)=>'<div class="rvli"><b>'+(i+1)+'.</b> '+esc(x)+'</div>').join(""):'')+
    ((!ings.length&&!steps.length)?'<div class="toc-d" style="margin-top:10px">No ingredients or steps saved yet — open the full recipe link, or add them under Recipes.</div>':'');
  show("Rview");
}
function closeRview(e){if(e&&e.target&&e.target.id!=="scrimRview"&&e.type==="click")return;hide("Rview");}

// auto em dash: turn "--" into "—" as you type, keeping the caret in place
function emDash(el){if(!el)return;const v=el.value;if(v.indexOf("--")<0)return;const nv=v.replace(/--/g,"—");const caret=el.selectionStart-(v.length-nv.length);el.value=nv;try{el.setSelectionRange(caret,caret);}catch(e){}}
function updateMeta(){const pt=document.getElementById("pageTitle"),it=document.getElementById("intro");emDash(pt);emDash(it);model.title=pt.value;model.intro=it.value;queueSave();}
function onThoughts(k,ta){emDash(ta);ensureDay(k).note=ta.value;queueSave();grow(ta);checkSlash(ta,k);}

/* ---------- Notion-style "/" command ---------- */
let slashCtx=null,slashRecipeMode="ref";
function checkSlash(ta,k){const v=ta.value,c=ta.selectionStart;if(c>0&&v[c-1]==="/"&&(c<2||/\s/.test(v[c-2]))){slashCtx={ta,day:k,pos:c-1};show("Slash");}}
function closeSlash(e){if(e&&e.target&&e.target.id!=="scrimSlash"&&e.type==="click")return;hide("Slash");slashCtx=null;}
function insertAtSlash(text){if(!slashCtx)return;const{ta,day,pos}=slashCtx;const v=ta.value;const nv=v.slice(0,pos)+text+v.slice(pos+1);ta.value=nv;ensureDay(day).note=nv;queueSave();grow(ta);const cp=pos+text.length;hide("Slash");hide("Pick");slashCtx=null;try{ta.focus();ta.setSelectionRange(cp,cp);}catch(e){}}
function dropSlashChar(){if(!slashCtx)return;const{ta,day,pos}=slashCtx;const v=ta.value;const nv=v.slice(0,pos)+v.slice(pos+1);ta.value=nv;ensureDay(day).note=nv;grow(ta);}
function slashAction(kind){
  if(kind==="todo")insertAtSlash("[ ] ");
  else if(kind==="date")insertAtSlash(new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",month:"long",day:"numeric",year:"numeric"}).format(new Date())+" ");
  else if(kind==="divider")insertAtSlash("\n———\n");
  else if(kind==="meal"){const day=slashCtx?slashCtx.day:todayKey();insertAtSlash("");openAdd(day);}
}
function slashPickRecipe(mode){slashRecipeMode=mode;pickMeal="__slash";pickCat="all";document.getElementById("pickTitle").textContent=(mode==="want"?"Want to cook":"Insert a recipe");document.getElementById("pickSearch").value="";renderPick();hide("Slash");show("Pick");}
function jump(id){const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}

/* ---------- add a bite ---------- */
function buildChips(){const c=document.getElementById("typeChips");c.innerHTML="";const h=ctHour();pendingType=h<11?"Breakfast":h<15?"Lunch":h<21?"Dinner":"Snack";TYPES.forEach(t=>{const b=document.createElement("button");b.className="chip"+(t===pendingType?" sel":"");b.textContent=t;b.onclick=()=>{pendingType=t;[...c.children].forEach(x=>x.classList.remove("sel"));b.classList.add("sel");};c.appendChild(b);});}
function buildWhere(){const c=document.getElementById("whereChips");c.innerHTML="";WHERES.forEach(w=>{const b=document.createElement("button");b.className="chip"+(w===pendingWhere?" sel":"");b.textContent=w;b.onclick=()=>{pendingWhere=(pendingWhere===w?"":w);[...c.children].forEach(x=>x.classList.remove("sel"));if(pendingWhere===w)b.classList.add("sel");};c.appendChild(b);});}
function openAdd(day){pendingDay=day;pendingPhoto=null;pendingWhere="";document.getElementById("note").value="";document.getElementById("addTitle").textContent="Log a bite — "+dayShort(day);document.getElementById("photoPick").innerHTML='<div class="ph"><div class="ic">+</div><div class="t">Tap to take or choose a photo</div></div>';buildChips();buildWhere();show("Add");}
function onPhoto(ev){const f=ev.target.files[0];if(!f)return;compress(f,u=>{pendingPhoto=u;document.getElementById("photoPick").innerHTML='<img src="'+u+'">';});}
async function saveEntry(){
  const note=document.getElementById("note").value.trim();
  if(!pendingPhoto&&!note){toast("Add a photo or a note");return;}
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  if(pendingPhoto){try{await putPhoto(id,pendingPhoto);}catch(e){toast("Couldn't save photo");return;}}
  const log=loadLog(),k=pendingDay||todayKey();log[k]=log[k]||[];
  log[k].push({id,t:Date.now(),type:pendingType,note,source:pendingWhere||"",photo:!!pendingPhoto});
  saveLog(log);hide("Add");renderDays();renderTOC();toast("Logged");
}
async function delEntry(k,id){const log=loadLog();log[k]=(log[k]||[]).filter(e=>e.id!==id);if(!log[k].length)delete log[k];saveLog(log);await delPhoto(id);renderDays();renderTOC();}

/* ---------- plan picker ---------- */
function openPick(meal){pickMeal=meal;pickCat="all";document.getElementById("pickTitle").textContent="Add to "+meal;document.getElementById("pickSearch").value="";renderPick();show("Pick");}
function setPickCat(c){pickCat=c;renderPick();}
function renderPick(){
  const all=loadRecipes();
  const present=CAT_ORDER.filter(k=>all.some(r=>recipeCat(r)===k));
  if(pickCat!=="all"&&!present.includes(pickCat))pickCat="all";
  let pf='<button class="ppill'+(pickCat==="all"?" on":"")+'" onclick="setPickCat(\'all\')">All</button>';
  present.forEach(k=>{pf+='<button class="ppill'+(pickCat===k?" on":"")+'" onclick="setPickCat(\''+k+'\')">'+CAT_LABEL(k)+'</button>';});
  document.getElementById("pickFilters").innerHTML=pf;
  const q=(document.getElementById("pickSearch").value||"").toLowerCase();
  let list=all;
  if(pickCat!=="all")list=list.filter(r=>recipeCat(r)===pickCat);
  if(q)list=list.filter(r=>(r.title+" "+(r.tags||[]).join(" ")).toLowerCase().includes(q));
  document.getElementById("pickList").innerHTML=list.slice(0,120).map(r=>'<button class="ppick" onclick="pickChoose(\''+r.id+'\')">'+(r.img?'<span class="ppthumb"><img src="'+esc(r.img)+'" onerror="this.parentNode.style.display=\'none\'"></span>':'<span class="ppthumb"></span>')+'<span class="ppt">'+esc(r.title)+'</span><span class="ppc">'+CAT_LABEL(recipeCat(r))+'</span></button>').join("")||'<div class="toc-d" style="padding:8px">No matches</div>';
}
function pickChoose(id){
  if(pickMeal==="__slash"){
    dropSlashChar();
    const day=slashCtx?slashCtx.day:todayKey();
    ensureDay(day).recipes.push({id,want:slashRecipeMode==="want"});
    queueSave();slashCtx=null;hide("Pick");renderDays();renderTOC();toast("Added recipe");
    return;
  }
  if(planAdd(pickMeal,id)){hide("Pick");toast("Added to "+pickMeal);}
}

/* sheets */
function show(n){document.getElementById("scrim"+n).classList.add("on");document.getElementById("sheet"+n).classList.add("on");}
function hide(n){document.getElementById("scrim"+n).classList.remove("on");document.getElementById("sheet"+n).classList.remove("on");}
function closeAdd(e){if(e&&e.target&&e.target.id!=="scrimAdd"&&e.type==="click")return;hide("Add");}
function closePick(e){if(e&&e.target&&e.target.id!=="scrimPick"&&e.type==="click")return;hide("Pick");}

document.addEventListener("warroom:cloud-ready",renderAll);
renderAll();
</script>
</body>
</html>
